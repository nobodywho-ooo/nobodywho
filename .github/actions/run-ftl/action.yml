name: "Run device tests on Firebase Test Lab"
description: >
  Checks that the app APK's native library can actually be loaded, then runs the
  instrumentation tests on the pinned physical devices. Used by every binding's
  device-test job so the device matrix and the loadability check live in one
  place.

inputs:
  app-apk:
    description: "Path to the app APK"
    required: true
  test-apk:
    description: "Path to the androidTest APK"
    required: true
  native-lib:
    description: "Name of the binding's .so inside the APK, e.g. libnobodywho_uniffi.so"
    required: true
  model-url:
    description: "Model the device tests run against, fetched here rather than on the device."
    required: false
    default: "https://huggingface.co/NobodyWho/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen_Qwen3-0.6B-Q4_K_M.gguf"
  devices:
    description: "both | pixel8-mali | s24ultra-adreno"
    required: false
    default: "both"
  test-timeout:
    description: "Per-device timeout passed to gcloud"
    required: false
    default: "30m"
  results-bucket:
    description: "Cloud Storage bucket for results"
    required: false
    default: "nobodywho-android-ci-ftl-results"
  project-id:
    description: "Google Cloud project that owns the Test Lab runs and the results bucket"
    required: true
  workload-identity-provider:
    required: true
  service-account:
    required: true

runs:
  using: composite
  steps:
    - name: "Check the project id is set"
      shell: bash
      run: |
        if [ -z "${{ inputs.project-id }}" ]; then
          echo "::error::project-id is empty. Set the GCP_PROJECT_ID repository variable under Settings > Secrets and variables > Actions > Variables."
          exit 1
        fi

    - name: "Verify the packaged native library can load"
      shell: bash
      run: |
        set -euo pipefail
        APK="${{ inputs.app-apk }}"
        LIB="${{ inputs.native-lib }}"
        TMP="$(mktemp -d)"
        # || true: unzip exits non-zero when the APK has no arm64-v8a
        # entries at all. Under set -e that would kill the script here,
        # skipping the crafted error message and ABI listing below in favor
        # of a bare unzip exit code.
        unzip -o -q "$APK" 'lib/arm64-v8a/*' -d "$TMP" || true

        SO="$TMP/lib/arm64-v8a/$LIB"
        if [ ! -f "$SO" ]; then
          echo "::error::$LIB is missing from $APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/' || true
          exit 1
        fi
        echo "  OK  $LIB is packaged"

        # The library loads iff every non-system dependency sits next to it in
        # the APK. That holds both for a self-contained build and for an older
        # one that ships its own libc++_shared.so, so this check stays correct
        # across releases instead of hard-coding an expected file list.
        # Everything below is provided by Android itself (public NDK libraries).
        missing=0
        while read -r need; do
          case "$need" in
            libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so| \
            libvulkan.so|libEGL.so|libGLESv1_CM.so|libGLESv2.so|libGLESv3.so| \
            libjnigraphics.so|libmediandk.so|libaaudio.so|libOpenSLES.so|libnativewindow.so)
              echo "  ..  $need (provided by Android)" ;;
            *)
              if [ -f "$TMP/lib/arm64-v8a/$need" ]; then
                echo "  OK  $need (packaged alongside)"
              else
                echo "::error::$LIB needs $need at runtime, but it is neither packaged in the APK nor provided by Android. Fix this in the library, not in the test app."
                missing=1
              fi ;;
          esac
        done < <(readelf -d "$SO" | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p')
        [ "$missing" = "0" ]

    - name: "Authenticate to Google Cloud"
      uses: google-github-actions/auth@v2
      with:
        project_id: ${{ inputs.project-id }}
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}

    - name: "Setup gcloud"
      uses: google-github-actions/setup-gcloud@v2

    # Needed to construct the path to the OBB file with the test model.
    - name: "Read the app's package and versionCode from the APK"
      id: apk
      shell: bash
      run: |
        set -euo pipefail
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [ -z "$SDK" ]; then
          echo "::error::neither ANDROID_HOME nor ANDROID_SDK_ROOT is set"
          exit 1
        fi
        # || true: find exits non-zero when build-tools is missing entirely,
        # which under set -e would skip the error message below.
        AAPT2="$(find "$SDK/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -1 || true)"
        if [ -z "$AAPT2" ]; then
          echo "::error::no aapt2 under $SDK/build-tools; run-ftl needs it to name the OBB"
          exit 1
        fi
        BADGING="$("$AAPT2" dump badging "${{ inputs.app-apk }}")"
        PKG="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$BADGING")"
        CODE="$(sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING")"
        if [ -z "$PKG" ] || [ -z "$CODE" ]; then
          echo "::error::could not read package/versionCode from ${{ inputs.app-apk }}"
          exit 1
        fi
        echo "  OK  $PKG versionCode $CODE"
        echo "package=$PKG" >> "$GITHUB_OUTPUT"
        echo "version-code=$CODE" >> "$GITHUB_OUTPUT"

    # Downloading the model during test execution caused flakiness,
    # so download it here and transfer it along with the APK instead.
    - name: "Fetch the model and stage it as an OBB"
      id: model
      shell: bash
      run: |
        set -euo pipefail
        curl -L --fail --retry 3 --retry-all-errors --progress-bar \
          "${{ inputs.model-url }}" -o model.gguf
        # gcloud derives the destination from the name, so it has to be exactly
        # main.<versionCode>.<package>.obb.
        OBB="main.${{ steps.apk.outputs.version-code }}.${{ steps.apk.outputs.package }}.obb"
        mv model.gguf "$OBB"
        ls -lh "$OBB"
        echo "obb=$OBB" >> "$GITHUB_OUTPUT"
        echo "device-path=/sdcard/Android/obb/${{ steps.apk.outputs.package }}/$OBB" >> "$GITHUB_OUTPUT"

    - name: "Run instrumentation tests on Firebase Test Lab"
      shell: bash
      run: |
        set -euo pipefail
        # Explicit "both", not a fallthrough default — a typo in $devices would
        # otherwise silently run on both devices instead of failing fast.
        case "${{ inputs.devices }}" in
          pixel8-mali)     DEVICES=(--device model=shiba,version=34,locale=en,orientation=portrait) ;;
          s24ultra-adreno) DEVICES=(--device model=e3q,version=34,locale=en,orientation=portrait) ;;
          both)            DEVICES=(--device model=shiba,version=34,locale=en,orientation=portrait \
                                    --device model=e3q,version=34,locale=en,orientation=portrait) ;;
          *)               echo "::error::unknown devices input '${{ inputs.devices }}'; expected both, pixel8-mali, or s24ultra-adreno"
                            exit 1 ;;
        esac

        # Non-default name for better browsing in GCP
        RESULTS_DIR="$(date -u +%Y-%m-%d_%H:%M:%S)_$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"

        echo "Running instrumentation tests on Firebase Test Lab."
        echo "The GCP bucket is generally a much better source of information than the Firebase console."
        gcloud firebase test android run \
          --project "${{ inputs.project-id }}" \
          --type instrumentation \
          --app "${{ inputs.app-apk }}" \
          --test "${{ inputs.test-apk }}" \
          "${DEVICES[@]}" \
          --results-bucket "${{ inputs.results-bucket }}" \
          --results-dir "$RESULTS_DIR" \
          --obb-files "${{ steps.model.outputs.obb }}" \
          --environment-variables "modelUrl=${{ steps.model.outputs.device-path }}" \
          --timeout "${{ inputs.test-timeout }}"
