name: "Stage Android jniLibs for one ABI"
description: >
  Copies one Rust target's CI artifacts (the renamed entry-point .so and the
  nobodywho-runtime-<target> dir of common libs + CPU backends) into a
  jniLibs/<abi>-shaped directory, ready for Gradle's AAR packaging.

inputs:
  integration:
    description: "Entry-point binding: uniffi or flutter"
    required: true
  target:
    description: "Rust target triple (e.g. aarch64-linux-android)"
    required: true
  source-dir:
    description: "Directory holding the downloaded artifact for this target"
    required: true
  jnilibs-dir:
    description: "Destination ABI directory to populate (e.g. .../jniLibs/arm64-v8a)"
    required: true

runs:
  using: composite
  steps:
    - name: "Copy entry-point library and runtime libs"
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${{ inputs.jnilibs-dir }}"
        cp "${{ inputs.source-dir }}/libnobodywho-${{ inputs.integration }}-${{ inputs.target }}-release.so" \
          "${{ inputs.jnilibs-dir }}/libnobodywho_${{ inputs.integration }}.so"
        cp -L "${{ inputs.source-dir }}/nobodywho-runtime-${{ inputs.target }}/"* \
          "${{ inputs.jnilibs-dir }}/"
        if [ "${{ inputs.target }}" = x86_64-linux-android ]; then
          cp "${{ inputs.source-dir }}/libonnxruntime.so" "${{ inputs.jnilibs-dir }}/"
        fi
