name: "Publish an Android binding AAR"
description: >
  Publishes one device-tested AAR to Maven Central and skips the upload when
  that version already exists (Central versions are immutable, so a re-run
  after a successful publish must not fail). Does not block on Central Portal's
  sync to repo1: the caller's wrapper-package publish (pub/npm) proceeds right
  away, at the cost of a narrow window where a consumer building against the
  brand-new version sees the native AAR 404 until sync catches up.

inputs:
  binding:
    description: "Android packaging binding: flutter or react-native"
    required: true
  artifact-id:
    description: "Maven artifact ID"
    required: true
  version:
    description: "Binding and Maven version"
    required: true
  candidates-path:
    description: "Downloaded Android candidates directory"
    default: "android-candidates"

runs:
  using: composite
  steps:
    - name: "Check whether this version is already on Maven Central"
      id: check
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        VERSION: ${{ inputs.version }}
        CANDIDATES_PATH: ${{ inputs.candidates-path }}
      run: |
        set -euo pipefail
        AAR="$(realpath "$CANDIDATES_PATH")/$ARTIFACT_ID-$VERSION.aar"
        test -f "$AAR"

        URL="https://repo1.maven.org/maven2/ai/nobodywho/$ARTIFACT_ID/$VERSION/$ARTIFACT_ID-$VERSION.aar"
        HTTP_STATUS=$(curl --silent --show-error --location --head \
          --write-out '%{http_code}' --output /dev/null "$URL")
        case "$HTTP_STATUS" in
          200) SHOULD_PUBLISH=false; echo "$ARTIFACT_ID:$VERSION is already published" ;;
          404) SHOULD_PUBLISH=true ;;
          *)
            echo "::error::Maven Central returned HTTP $HTTP_STATUS for $ARTIFACT_ID:$VERSION"
            exit 1
            ;;
        esac

        {
          echo "aar=$AAR"
          echo "url=$URL"
          echo "should-publish=$SHOULD_PUBLISH"
        } >> "$GITHUB_OUTPUT"

    - name: "Publish exact AAR to Maven Central"
      if: steps.check.outputs.should-publish == 'true'
      shell: bash
      env:
        BINDING: ${{ inputs.binding }}
        VERSION: ${{ inputs.version }}
        AAR: ${{ steps.check.outputs.aar }}
      run: |
        set -euo pipefail
        ./nobodywho/kotlin/gradlew -p nobodywho/android \
          publishAggregationToCentralPortal \
          -PnobodywhoBinding="$BINDING" \
          -Pversion="$VERSION" \
          -PnobodywhoPrebuiltAar="$AAR"

    # after publishing it can take some time until the new version resolves
    - name: "Warn if Maven Central sync is unusually slow"
      if: steps.check.outputs.should-publish == 'true'
      shell: bash
      env:
        URL: ${{ steps.check.outputs.url }}
      run: |
        if ! curl --fail --silent --show-error --location --head "$URL" --output /dev/null; then
          echo "::warning::$URL is not yet resolvable from Maven Central. Consumers building against this version in the next few minutes may see the native AAR fail to resolve until Central Portal's sync to repo1 completes."
        fi
