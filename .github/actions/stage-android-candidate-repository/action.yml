name: "Stage an Android candidate for normal Maven resolution"
description: >
  Places one already-built candidate AAR in a runner-local Maven repository.
  This lets an unmodified packaged binding resolve the candidate through its
  normal Maven dependency instead of using a test-only file override. Nothing
  is uploaded or made externally visible.

inputs:
  integration:
    description: "Native integration to stage: uniffi or flutter"
    required: true
  candidates-path:
    description: "Directory containing the downloaded candidate AARs and POMs"
    required: false
    default: "android-candidates"
  version-source:
    description: "Binding Gradle file containing its nobodywhoNativeVersion declaration"
    required: true

outputs:
  repository:
    description: "Absolute path to the runner-local Maven repository"
    value: ${{ steps.stage.outputs.repository }}
  native-version:
    description: "Maven version declared by the binding"
    value: ${{ steps.stage.outputs.native-version }}

runs:
  using: composite
  steps:
    - name: "Stage candidate in the runner-local Maven repository"
      id: stage
      shell: bash
      env:
        INTEGRATION: ${{ inputs.integration }}
        CANDIDATES_PATH: ${{ inputs.candidates-path }}
        VERSION_SOURCE: ${{ inputs.version-source }}
      run: |
        set -euo pipefail

        case "$INTEGRATION" in
          uniffi) ARTIFACT_ID=nobodywho-uniffi-android ;;
          flutter) ARTIFACT_ID=nobodywho-flutter-android ;;
          *)
            echo "::error::unknown Android integration '$INTEGRATION'"
            exit 1
            ;;
        esac

        CANDIDATES_PATH=$(realpath "$CANDIDATES_PATH")
        VERSION_SOURCE=$(realpath "$VERSION_SOURCE")

        shopt -s nullglob
        AARS=("$CANDIDATES_PATH"/"$ARTIFACT_ID"-*.aar)
        POMS=("$CANDIDATES_PATH"/"$ARTIFACT_ID"-*.pom)
        if [[ ${#AARS[@]} -ne 1 || ${#POMS[@]} -ne 1 ]]; then
          echo "::error::expected exactly one $ARTIFACT_ID candidate AAR and POM"
          exit 1
        fi
        NATIVE_VERSION=$(sed -n \
          's/.*nobodywhoNativeVersion *= *"\([^"]*\)".*/\1/p' \
          "$VERSION_SOURCE")
        if [[ -z "$NATIVE_VERSION" || "$NATIVE_VERSION" == *$'\n'* ]]; then
          echo "::error::could not read one nobodywhoNativeVersion from $VERSION_SOURCE"
          exit 1
        fi
        if [[ ! "$NATIVE_VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then
          echo "::error::invalid native Maven version '$NATIVE_VERSION'"
          exit 1
        fi

        CANDIDATE_FILE=$(basename "${AARS[0]}")
        CANDIDATE_VERSION=${CANDIDATE_FILE#"$ARTIFACT_ID"-}
        CANDIDATE_VERSION=${CANDIDATE_VERSION%.aar}
        if [[ "$GITHUB_REF_NAME" == nobodywho-android-v* ]]; then
          RELEASE_VERSION=${GITHUB_REF_NAME#nobodywho-android-v}
          if [[ "$CANDIDATE_VERSION" != "$RELEASE_VERSION" || "$NATIVE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::Android release $RELEASE_VERSION must match candidate $CANDIDATE_VERSION and binding pin $NATIVE_VERSION"
            exit 1
          fi
        fi

        REPOSITORY="$RUNNER_TEMP/nobodywho-candidate-maven"
        DESTINATION="$REPOSITORY/ai/nobodywho/$ARTIFACT_ID/$NATIVE_VERSION"
        mkdir -p "$DESTINATION"
        cp "${AARS[0]}" "$DESTINATION/$ARTIFACT_ID-$NATIVE_VERSION.aar"
        if [[ $(grep -c '<version>[^<]*</version>' "${POMS[0]}") -ne 1 ]]; then
          echo "::error::expected exactly one version element in ${POMS[0]}"
          exit 1
        fi
        sed -E \
          "s#<version>[^<]+</version>#<version>$NATIVE_VERSION</version>#" \
          "${POMS[0]}" > "$DESTINATION/$ARTIFACT_ID-$NATIVE_VERSION.pom"

        echo "NOBODYWHO_CANDIDATE_MAVEN_REPO=$REPOSITORY" >> "$GITHUB_ENV"
        echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
        echo "native-version=$NATIVE_VERSION" >> "$GITHUB_OUTPUT"
        echo "Staged $ARTIFACT_ID:$NATIVE_VERSION from ${AARS[0]}"
