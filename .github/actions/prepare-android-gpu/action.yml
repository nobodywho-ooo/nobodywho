name: Prepare static Android GPU backends
description: Fetch pinned OpenCL, Vulkan and SPIR-V headers and export the Android GPU build environment.
inputs:
  target:
    required: true
    description: Rust Android target
  ndk:
    required: true
    description: Android NDK directory
runs:
  using: composite
  steps:
    - name: Build GPU dependencies
      shell: bash
      env:
        ANDROID_NDK: ${{ inputs.ndk }}
        GPU_TARGET: ${{ inputs.target }}
      run: bash nobodywho/android/prepare-gpu.sh "$GPU_TARGET" --github-env >> "$GITHUB_ENV"
