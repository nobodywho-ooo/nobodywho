name: "Docs"
on:
  workflow_call:
    inputs:
      branch:
        # Cloudflare Pages branch to deploy as. `main` is production
        # (docs.nobodywho.ooo); any other branch is a preview deploy.
        type: string
        default: main
    outputs:
      url:
        description: "Deployed URL: the branch alias when there is one, else this deploy's URL."
        value: ${{ jobs.deploy-pages.outputs.url }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write
jobs:
  deploy-pages:
    runs-on: warp-ubuntu-latest-x64-2x
    outputs:
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Unsupported branch name for a Pages deploy: $BRANCH"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci

      - name: Build documentation
        working-directory: ./docs
        run: npm run build

      - name: Deploy to cloudflare pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Explicit --branch: wrangler would otherwise guess it from the checkout.
          command: pages deploy ./docs/build/ --project-name=nobodywho-docs --branch=${{ inputs.branch }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

