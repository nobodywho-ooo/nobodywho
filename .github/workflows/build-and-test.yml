name: "Build and test"
on:
  push:
    branches: [main]
    tags: ['nobodywho-*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      full_ci:
        type: boolean
        default: true
        description: 'Run full CI suite (all platforms, all tests)'
      buckets:
        type: string
        default: ''
        description: 'Space-separated bucket keys to run (set by /<bucket>-ci PR comments)'

# Cancel in-flight PR runs when a new commit is pushed to that PR.
# Don't cancel main / tag / dispatch runs — those are canonical signals we
# want to see through to completion. Key those on the SHA so each merge gets
# its own group and runs immediately, instead of queueing behind the previous
# main run (same ref -> same group -> serialized with cancel disabled).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

jobs:
  # Single source of truth for "what should this CI run do?" — reads paths,
  # labels, and the event, emits a run_* boolean per bucket. Every other job
  # gates on these outputs; no other workflow inspects labels or paths.
  plan:
    uses: ./.github/workflows/plan.yml
    with:
      dispatch_full_ci: ${{ github.event_name == 'workflow_dispatch' && inputs.full_ci }}
      dispatch_buckets: ${{ (github.event_name == 'workflow_dispatch' && inputs.buckets) || '' }}

  linting:
    uses: ./.github/workflows/linting.yml

  regen-checks:
    needs: plan
    if: needs.plan.outputs.run_regen == 'true'
    uses: ./.github/workflows/regen-checks.yml

  python-ci:
    needs: plan
    if: needs.plan.outputs.run_python == 'true' || needs.plan.outputs.run_python_models == 'true'
    uses: ./.github/workflows/python-ci.yml
    with:
      run_python:        ${{ needs.plan.outputs.run_python == 'true' }}
      run_python_models: ${{ needs.plan.outputs.run_python_models == 'true' }}

  build:
    needs: plan
    if: |
      needs.plan.outputs.run_godot == 'true' ||
      needs.plan.outputs.run_flutter == 'true' ||
      needs.plan.outputs.run_swift == 'true' ||
      needs.plan.outputs.run_kotlin == 'true' ||
      needs.plan.outputs.run_react_native == 'true' ||
      needs.plan.outputs.run_csharp == 'true' ||
      needs.plan.outputs.run_apple_extended == 'true'
    uses: ./.github/workflows/build.yml
    with:
      run_godot:        ${{ needs.plan.outputs.run_godot == 'true' }}
      run_flutter:      ${{ needs.plan.outputs.run_flutter == 'true' }}
      run_swift:        ${{ needs.plan.outputs.run_swift == 'true' }}
      run_kotlin:       ${{ needs.plan.outputs.run_kotlin == 'true' }}
      run_react_native: ${{ needs.plan.outputs.run_react_native == 'true' }}
      run_csharp:       ${{ needs.plan.outputs.run_csharp == 'true' }}
      # visionOS/watchOS: nightly rust + ORT from source. Full runs, or
      # /apple-extended-ci to compile-check just those targets.
      apple_extended:   ${{ needs.plan.outputs.run_apple_extended == 'true' }}

  swift-ci:
    needs: [plan, build]
    if: needs.plan.outputs.run_swift == 'true'
    uses: ./.github/workflows/swift-ci.yml

  kotlin-ci:
    needs: [plan, build]
    if: needs.plan.outputs.run_kotlin == 'true'
    uses: ./.github/workflows/kotlin-ci.yml

  csharp-ci:
    needs: [plan, build]
    if: needs.plan.outputs.run_csharp == 'true'
    uses: ./.github/workflows/csharp-ci.yml

  test:
    # Always invoked so the flutter doctest-drift check runs on every event.
    # The heavy jobs inside (nix flake check, flutter multimodal/SpeechToText) gate
    # themselves on run_rust_core / run_flutter.
    needs: plan
    uses: ./.github/workflows/test.yml
    with:
      run_rust_core: ${{ needs.plan.outputs.run_rust_core == 'true' }}
      run_flutter:   ${{ needs.plan.outputs.run_flutter == 'true' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # On-device tests on real phones via Firebase Test Lab. plan.yml selects jobs
  # here only for a release tag (the binding being released) or an explicit
  # /<binding>-device-<source|released>-ci comment — never for an ordinary push.
  mobile-device-tests:
    needs: plan
    if: needs.plan.outputs.device_jobs != ''
    uses: ./.github/workflows/mobile-device-tests.yml
    with:
      jobs: ${{ needs.plan.outputs.device_jobs }}
    secrets:
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

  release:
    needs: [plan, linting, regen-checks, build, test, python-ci, swift-ci, kotlin-ci, csharp-ci, mobile-device-tests]
    # always() so a *skipped* mobile-device-tests does not skip the release —
    # Swift/Python/Godot tags have no Android device tests. Failures and
    # cancellations still block, which is the point: a kotlin release cannot
    # ship unless its device job passed.
    if: >-
      always() &&
      needs.plan.outputs.run_release == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/release.yml
    secrets:
      TEST_PYPI_AUTH_TOKEN: ${{ secrets.TEST_PYPI_AUTH_TOKEN }}
      PYPI_AUTH_TOKEN: ${{ secrets.PYPI_AUTH_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      SWIFT_MIRROR_TOKEN: ${{ secrets.SWIFT_MIRROR_TOKEN }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  docs:
    # Production build+deploy only happens on main (or the legacy deploy branch),
    # so keep this ref-gated even when run_docs is true. PR previews are the
    # separate docs-preview job below, triggered by /docs-ci.
    needs: plan
    if: needs.plan.outputs.run_docs == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy-cloudflare-pages')
    uses: ./.github/workflows/docs.yml
    with:
      branch: main
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  docs-preview:
    # /docs-ci on a PR: deploy this branch's docs as a Cloudflare Pages preview
    # (never production). Dispatch-only, so it only runs for branches in this
    # repo, never for fork code.
    needs: plan
    if: >-
      needs.plan.outputs.run_docs_preview == 'true'
      && github.event_name == 'workflow_dispatch'
      && github.ref != 'refs/heads/main'
    uses: ./.github/workflows/docs.yml
    with:
      branch: ${{ github.ref_name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  docs-preview-comment:
    # Posts the preview link on the branch's PR, editing one marked comment on reruns.
    needs: docs-preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        env:
          BRANCH: ${{ github.ref_name }}
          URL: ${{ needs.docs-preview.outputs.url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { BRANCH: branch, URL: url } = process.env;
            if (!url) {
              core.setFailed('Pages deploy produced no URL');
              return;
            }
            const sha = context.sha.slice(0, 7);
            await core.summary.addRaw(`Docs preview for \`${branch}\` (${sha}): ${url}`).write();

            // head=owner:branch matches only PRs from this repo, not forks.
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}` });
            if (prs.length === 0) {
              core.notice(`No open PR for ${branch}; preview is at ${url}`);
              return;
            }
            const marker = '<!-- docs-preview -->';
            const body = `${marker}\n📖 **Docs preview** for \`${sha}\`: ${url}`;
            for (const pr of prs) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              const existing = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              }
            }
