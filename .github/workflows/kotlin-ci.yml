name: "Kotlin CI"

# Called by build.yml as soon as the Linux libraries are ready.
on: workflow_call

permissions:
  actions: write
  contents: read

jobs:
  test:
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v5

      - name: "Cache Gradle"
        # Warp cache (non-Windows runner). Gradle deps + wrapper distribution
        # are otherwise re-downloaded and modules recompiled cold every run.
        uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('nobodywho/kotlin/**/*.gradle*', 'nobodywho/kotlin/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: "Download uniffi Linux x86_64 artifact"
        uses: actions/download-artifact@v5
        with:
          name: nobodywho-uniffi-x86_64-unknown-linux-gnu-release
          path: ./native-lib

      - name: "Rename native lib for JNA"
        run: |
          cp ./native-lib/libnobodywho-uniffi-x86_64-unknown-linux-gnu-release.so \
            ./native-lib/libnobodywho_uniffi.so

      - name: "Install Vulkan runtime"
        # The .so links libvulkan; JNA needs it at test runtime.
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1

      - name: "Setup JDK"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - name: "Compile Kotlin modules"
        working-directory: ./nobodywho/kotlin
        run: ./gradlew :nobodywho-core:compileKotlin :android:compileDebugKotlin :jvm:compileKotlin

      - name: Cache test model
        uses: WarpBuilds/cache@v2
        with:
          path: test-models/
          key: test-models-kotlin-${{ hashFiles('.github/workflows/kotlin-ci.yml') }}

      - name: "Download test model"
        timeout-minutes: 20
        run: |
          bash .github/scripts/download-model.sh --output test-models/model.gguf \
            --url "https://huggingface.co/NobodyWho/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen_Qwen3-0.6B-Q4_K_M.gguf"

      - name: "Run tests"
        working-directory: ./nobodywho/kotlin
        env:
          NOBODYWHO_LIB_DIR: ${{ github.workspace }}/native-lib
          TEST_MODEL: ${{ github.workspace }}/test-models/model.gguf
        run: ./gradlew :nobodywho-core:test
      - name: Cancel this CI run on failure
        if: >-
          failure() &&
          github.workflow == 'Build and test' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.actions.cancelWorkflowRun({
                ...context.repo,
                run_id: context.runId,
              });
            } catch (error) {
              if (error.status !== 409) throw error;
              core.info('Cancellation was already requested or the run has finished.');
            }
