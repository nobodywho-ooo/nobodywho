name: "Kotlin CI"

# Gated by build-and-test.yml on needs.plan.outputs.run_kotlin — the workflow
# itself has no input; it only runs when the plan job says kotlin is in scope.
on: workflow_call

permissions:
  contents: read

jobs:
  test:
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v5

      - name: "Cache Gradle"
        # Warp cache (non-Windows runner). Gradle deps + wrapper distribution
        # are otherwise re-downloaded and modules recompiled cold every run.
        uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('nobodywho/kotlin/**/*.gradle*', 'nobodywho/kotlin/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: "Download uniffi Linux x86_64 artifact"
        uses: actions/download-artifact@v5
        with:
          name: nobodywho-uniffi-x86_64-unknown-linux-gnu-release
          path: ./native-lib

      - name: "Download uniffi Android ARM64 artifact"
        uses: actions/download-artifact@v5
        with:
          name: nobodywho-uniffi-aarch64-linux-android-release
          path: ./android-arm64

      - name: "Download uniffi Android x86_64 artifact"
        uses: actions/download-artifact@v5
        with:
          name: nobodywho-uniffi-x86_64-linux-android-release
          path: ./android-x86_64

      - name: "Rename native lib for JNA"
        run: |
          cp ./native-lib/libnobodywho-uniffi-x86_64-unknown-linux-gnu-release.so \
            ./native-lib/libnobodywho_uniffi.so

      - name: "Install Vulkan runtime"
        # The .so links libvulkan; JNA needs it at test runtime.
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1

      - name: "Setup JDK"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - name: "Stage UniFFI jniLibs (arm64-v8a)"
        uses: ./.github/actions/stage-android-jnilibs
        with:
          integration: uniffi
          target: aarch64-linux-android
          source-dir: android-arm64
          jnilibs-dir: nobodywho/android/build/uniffi/jniLibs/arm64-v8a

      - name: "Stage UniFFI jniLibs (x86_64)"
        uses: ./.github/actions/stage-android-jnilibs
        with:
          integration: uniffi
          target: x86_64-linux-android
          source-dir: android-x86_64
          jnilibs-dir: nobodywho/android/build/uniffi/jniLibs/x86_64

      - name: "Move libc++_shared.so into Kotlin's own jniLibs"
        # The UniFFI AAR omits libc++_shared.so on purpose (see android/README.md)
        run: |
          set -euo pipefail
          for ABI in arm64-v8a x86_64; do
            KOTLIN_DIR="nobodywho/kotlin/android/build/jniLibs/$ABI"
            mkdir -p "$KOTLIN_DIR"
            mv "nobodywho/android/build/uniffi/jniLibs/$ABI/libc++_shared.so" "$KOTLIN_DIR/"
          done

      - name: "Build local multi-ABI UniFFI AAR"
        run: |
          set -euo pipefail
          ./nobodywho/kotlin/gradlew -p nobodywho/android uniffiAar
          AAR=$(ls nobodywho/android/build/outputs/nobodywho-uniffi-android-*.aar)
          echo "NOBODYWHO_UNIFFI_ANDROID_AAR=$PWD/$AAR" >> "$GITHUB_ENV"

      - name: "Compile Kotlin modules"
        working-directory: ./nobodywho/kotlin
        run: ./gradlew :nobodywho-core:compileKotlin :android:compileDebugKotlin :jvm:compileKotlin

      - name: "Download test model"
        run: |
          mkdir -p test-models
          curl -L -o test-models/model.gguf \
            "https://huggingface.co/NobodyWho/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen_Qwen3-0.6B-Q4_K_M.gguf"

      - name: "Run tests"
        working-directory: ./nobodywho/kotlin
        env:
          NOBODYWHO_LIB_DIR: ${{ github.workspace }}/native-lib
          TEST_MODEL: ${{ github.workspace }}/test-models/model.gguf
        run: ./gradlew :nobodywho-core:test
