name: "Kotlin CI"

# Gated by build-and-test.yml on needs.plan.outputs.run_kotlin — the workflow
# itself has no input; it only runs when the plan job says kotlin is in scope.
on: workflow_call

permissions:
  contents: read

jobs:
  test:
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v5

      - name: "Cache Gradle"
        # Warp cache (non-Windows runner). Gradle deps + wrapper distribution
        # are otherwise re-downloaded and modules recompiled cold every run.
        uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('nobodywho/kotlin/**/*.gradle*', 'nobodywho/kotlin/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: "Download uniffi Linux x86_64 artifact"
        uses: actions/download-artifact@v5
        with:
          name: nobodywho-uniffi-x86_64-unknown-linux-gnu-release
          path: ./native-lib

      - name: "Rename native lib for JNA"
        run: |
          cp ./native-lib/libnobodywho-uniffi-x86_64-unknown-linux-gnu-release.so \
            ./native-lib/libnobodywho_uniffi.so

      - name: "Install Vulkan runtime"
        # The .so links libvulkan; JNA needs it at test runtime.
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1

      - name: "Setup JDK"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - name: "Compile Kotlin modules"
        working-directory: ./nobodywho/kotlin
        run: ./gradlew :nobodywho-core:compileKotlin :android:compileDebugKotlin :jvm:compileKotlin

      - name: "Download test model"
        run: |
          mkdir -p test-models
          curl -L -o test-models/model.gguf \
            "https://huggingface.co/NobodyWho/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen_Qwen3-0.6B-Q4_K_M.gguf"

      - name: "Run tests"
        working-directory: ./nobodywho/kotlin
        env:
          NOBODYWHO_LIB_DIR: ${{ github.workspace }}/native-lib
          TEST_MODEL: ${{ github.workspace }}/test-models/model.gguf
        run: ./gradlew :nobodywho-core:test

      # Bundle the binding + ggml/llama siblings into the JVM JAR resources (JNA layout), mirroring release.
      - name: "Bundle native libs into JVM JAR resources"
        run: |
          set -euo pipefail
          shopt -s nullglob
          d=./native-lib
          dest=nobodywho/kotlin/jvm/src/main/resources/linux-x86-64
          mkdir -p "$dest"
          cp "$d/libnobodywho_uniffi.so" "$dest/"
          libs=("$d"/libggml* "$d"/libllama*)
          [ ${#libs[@]} -eq 0 ] || cp -P "${libs[@]}" "$dest/"
          # jvmSmoke below would catch a missing sibling as an UnsatisfiedLinkError; assert
          # here so the failure names the missing file instead. Mirrors release.yml.
          # Quote glob entries so the `for` list doesn't nullglob-expand them against cwd;
          # match them against $dest with compgen instead. libggml-cpu is per-microarch under
          # GGML_CPU_ALL_VARIANTS, so there's no plain libggml-cpu.so — only libggml-cpu-*.so.
          for f in libggml.so libggml-base.so "libggml-cpu*.so" libggml-vulkan.so libllama.so libllama-common.so; do
            case "$f" in
              *'*'*) compgen -G "$dest/$f" >/dev/null || { echo "::error::no $f in the uniffi build artifact"; exit 1; } ;;
              *)     [ -f "$dest/$f" ]       || { echo "::error::$f missing from the uniffi build artifact"; exit 1; } ;;
            esac
          done

      # Load the packaged JAR the way a real consumer does — no NOBODYWHO_LIB_DIR /
      # jna.library.path shim — so the NativeLoader must resolve the sibling libs from the
      # JAR. Catches release-only UnsatisfiedLinkError the co-located unit tests can't.
      - name: "Run JVM packaging smoke test"
        working-directory: ./nobodywho/kotlin
        run: ./gradlew :jvm:jvmSmoke
