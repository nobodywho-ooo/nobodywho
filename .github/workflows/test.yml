name: "Test"
on:
  workflow_call:
    inputs:
      run_rust_core:
        description: "Run the canonical core test suite (nix flake check)."
        type: boolean
        default: false
      run_flutter:
        description: "Run Flutter doctest/multimodal/SpeechToText tests."
        type: boolean
        default: false
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true


jobs:


  flutter-doc-tests-check:
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate doctest file
        working-directory: nobodywho/flutter/nobodywho
        run: dart run tool/doctest.dart ../../../docs/docs-flutter --generate-only

      - name: Check if generated tests are up to date
        run: |
          if git diff --quiet nobodywho/flutter/nobodywho/test/doctest_generated_test.dart; then
            echo "✅ Generated doctests are up to date"
          else
            echo "❌ Generated doctests are out of date!"
            echo ""
            echo "Please run the following command and commit the changes:"
            echo "dart run tool/doctest.dart ../../../docs/docs-flutter --generate-only"
            exit 1
          fi
      - &cancel-ci-on-failure
        name: Cancel this CI run on failure
        if: >-
          failure() &&
          github.workflow == 'Build and test' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.actions.cancelWorkflowRun({
                ...context.repo,
                run_id: context.runId,
              });
            } catch (error) {
              if (error.status !== 409) throw error;
              core.info('Cancellation was already requested or the run has finished.');
            }



  # cachix actions as per these docs:
  # https://nix.dev/guides/recipes/continuous-integration-github-actions
  nix-flake-check:
    if: inputs.run_rust_core
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 360
    steps:
      - name: Check that Cachix Token is set
        run: |
          if [ -z "${{ secrets.CACHIX_AUTH_TOKEN }}" ]; then
            echo "❌ Token is empty!"
          else
            echo "✅ Token exists (length: ${#CACHIX_AUTH_TOKEN})"
          fi
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        with:
          name: nobodywho
          # If you chose API tokens for write access OR if you have a private cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # verbose! debug debug
          cachixArgs: "--verbose -j8"

      - name: "nix flake check"
        run: |
          nix --extra-experimental-features nix-command --extra-experimental-features flakes flake check -L --max-jobs 1
      - *cancel-ci-on-failure
  flutter-multimodal-tests:
    if: inputs.run_flutter
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Rust build
        uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.cargo
            nobodywho/target
          key: ${{ runner.os }}-flutter-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-cargo-

      - name: Install Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libshaderc-dev libvulkan-dev glslc

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.5

      - name: Build Flutter library
        working-directory: ./nobodywho
        run: cargo build -p nobodywho-flutter --locked

      - &cache-flutter-models
        name: Cache test models
        uses: WarpBuilds/cache@v2
        with:
          path: models/
          key: test-models-flutter-${{ github.job }}-${{ hashFiles('.github/workflows/test.yml') }}

      - name: Download vision models
        timeout-minutes: 20
        run: |
          source .github/scripts/download-model.sh
          download_model --url https://huggingface.co/unsloth/gemma-3-4b-it-GGUF/resolve/main/gemma-3-4b-it-Q4_K_M.gguf --output models/gemma-3-4b-it-Q4_K_M.gguf
          download_model --url https://huggingface.co/unsloth/gemma-3-4b-it-GGUF/resolve/main/mmproj-F16.gguf --output models/mmproj-gemma-3-f16.gguf

      - name: Run Flutter multimodal tests
        working-directory: ./nobodywho/flutter/nobodywho
        env:
          TEST_MULTIMODAL_MODEL: ${{ github.workspace }}/models/gemma-3-4b-it-Q4_K_M.gguf
          TEST_MULTIMODAL_MMPROJ: ${{ github.workspace }}/models/mmproj-gemma-3-f16.gguf
          LD_LIBRARY_PATH: ${{ github.workspace }}/nobodywho/target/debug
        run: flutter test test/nobodywho_multimodal_test.dart --reporter expanded
      - *cancel-ci-on-failure
  flutter-stt-tests:
    if: inputs.run_flutter
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Rust build
        uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.cargo
            nobodywho/target
          key: ${{ runner.os }}-flutter-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-cargo-

      - name: Install Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libshaderc-dev libvulkan-dev glslc

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.5

      - name: Build Flutter library
        working-directory: ./nobodywho
        run: cargo build -p nobodywho-flutter --locked

      - *cache-flutter-models
      - name: Download Whisper model
        timeout-minutes: 20
        run: |
          source .github/scripts/download-model.sh
          # fp32 ("default") files, matching the Flutter SpeechToText test's quantization='default'.
          WHISPER_BASE="https://huggingface.co/onnx-community/whisper-base/resolve/main"
          for file in onnx/encoder_model.onnx onnx/decoder_model_merged.onnx tokenizer.json generation_config.json config.json preprocessor_config.json; do
            download_model --url "$WHISPER_BASE/$file" --output "models/whisper-base/$file"
          done

      - name: Run Flutter SpeechToText tests
        working-directory: ./nobodywho/flutter/nobodywho
        env:
          TEST_WHISPER_MODEL: ${{ github.workspace }}/models/whisper-base
          TEST_AUDIO_FILE: ${{ github.workspace }}/assets/sound.mp3
          LD_LIBRARY_PATH: ${{ github.workspace }}/nobodywho/target/debug
        run: flutter test test/nobodywho_test.dart --name "SpeechToText" --reporter expanded
      - *cancel-ci-on-failure
