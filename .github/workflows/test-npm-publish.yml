name: "Test npm publish"

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  test-publish:
    # Builds the WASM module in release mode (`prepack`).
    runs-on: warp-ubuntu-latest-x64-4x
    env:
      # Keep in sync with js-ci.yml.
      EMSCRIPTEN_VERSION: "6.0.13"
    steps:
      - uses: actions/checkout@v5

      - name: "Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      # `npm publish` runs `prepack`, which type-checks, builds the WASM
      # module and bundles `dist/`, so it needs the same toolchain as js-ci.yml.
      - name: "Install Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-emscripten

      - name: "Install Emscripten"
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git --branch ${EMSCRIPTEN_VERSION}
          ./emsdk/emsdk install ${EMSCRIPTEN_VERSION}
          ./emsdk/emsdk activate ${EMSCRIPTEN_VERSION}
          echo "$(pwd)/emsdk/upstream/emscripten" >> "${GITHUB_PATH}"

      - name: "Install build dependencies"
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build

      - name: "Cache Rust build"
        uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.cargo
            nobodywho/target
          key: ${{ runner.os }}-js-wasm-emsdk${{ env.EMSCRIPTEN_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-js-wasm-emsdk${{ env.EMSCRIPTEN_VERSION }}-

      - name: "Install npm dependencies"
        working-directory: ./nobodywho/js
        run: npm ci

      - name: "Verify Login"
        working-directory: ./nobodywho/js
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Publish to npm"
        working-directory: ./nobodywho/js
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
