  mac-os-pip-install-test:
    if: inputs.run_python
    needs: [mac-os-build]
    runs-on: warp-macos-latest-arm64-6x
    strategy:
      fail-fast: true
      matrix:
        model: [Gemma]
        include:
          - model: Gemma
            model_name: google_gemma-3-4b-it-Q4_1.gguf
            model_iterations: 10
            model_link: https://huggingface.co/bartowski/google_gemma-3-4b-it-GGUF/resolve/main/google_gemma-3-4b-it-Q4_1.gguf
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: "Download wheel"
        uses: actions/download-artifact@v5
        with:
          name: nobodywho_python_macos
          path: ./wheels

      - name: Install wheel
        run: |
          python3 -m venv maturinvenv
          source ./maturinvenv/bin/activate
          pip install wheels/nobodywho*.whl

      - name: Cache installation-test model
        uses: WarpBuilds/cache@v2
        with:
          path: macos/nobodypython/models/${{ matrix.model_name }}
          key: install-model-macos-${{ matrix.model_name }}-${{ hashFiles('.github/workflows/python-ci.yml') }}

