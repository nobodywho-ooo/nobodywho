name: "Build"
on:
  workflow_call:
    inputs:
      run_godot:
        type: boolean
        default: false
      run_flutter:
        type: boolean
        default: false
      run_swift:
        type: boolean
        default: false
      run_kotlin:
        type: boolean
        default: false
      run_react_native:
        type: boolean
        default: false
      apple_extended:
        type: boolean
        default: false

jobs:
  matrix-gen:
    runs-on: ubuntu-latest
    outputs:
      integrations: ${{ steps.gen.outputs.integrations }}
      macos_matrix: ${{ steps.gen.outputs.macos_matrix }}
    steps:
      - id: gen
        run: |
          ints=()
          [[ "${{ inputs.run_godot }}"   == "true" ]] && ints+=('"godot"')   || true
          [[ "${{ inputs.run_flutter }}" == "true" ]] && ints+=('"flutter"') || true
          if [[ "${{ inputs.run_swift }}"        == "true" ]] || \
             [[ "${{ inputs.run_kotlin }}"       == "true" ]] || \
             [[ "${{ inputs.run_react_native }}" == "true" ]]; then
            ints+=('"uniffi"')
          fi
          IFS=,
          echo "integrations=[${ints[*]}]" >> "$GITHUB_OUTPUT"
          unset IFS

          combos=()
          add() { combos+=("{\"integration\":\"$1\",\"target\":\"$2\"}"); }
          desktop_ios=(x86_64-apple-darwin aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim)
          [[ "${{ inputs.run_godot }}"   == "true" ]] && for t in "${desktop_ios[@]}"; do add godot "$t"; done
          [[ "${{ inputs.run_flutter }}" == "true" ]] && for t in "${desktop_ios[@]}"; do add flutter "$t"; done
          declare -A uni=()
          if [[ "${{ inputs.run_swift }}" == "true" ]]; then
            for t in aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim; do uni["$t"]=1; done
          fi
          # Independent of run_swift so /apple-extended-ci can compile-check the
          # tier-3 targets alone, without the rest of the swift matrix.
          if [[ "${{ inputs.apple_extended }}" == "true" ]]; then
            for t in aarch64-apple-visionos aarch64-apple-visionos-sim \
                     aarch64-apple-watchos aarch64-apple-watchos-sim; do uni["$t"]=1; done
          fi
          if [[ "${{ inputs.run_react_native }}" == "true" ]]; then
            uni["aarch64-apple-ios"]=1; uni["aarch64-apple-ios-sim"]=1
          fi
          for t in "${!uni[@]}"; do add uniffi "$t"; done
          IFS=,
          echo "macos_matrix={\"include\":[${combos[*]}]}" >> "$GITHUB_OUTPUT"
          unset IFS

  cargo-build-linux:
    needs: matrix-gen
    if: inputs.run_godot || inputs.run_flutter || inputs.run_kotlin
    strategy:
      fail-fast: false
      matrix:
        target:
          - "x86_64-unknown-linux-gnu"
          - "aarch64-unknown-linux-gnu"
        integration: ${{ fromJSON(needs.matrix-gen.outputs.integrations) }}
        include:
          - target: x86_64-unknown-linux-gnu
            runner: warp-ubuntu-latest-x64-4x
          - target: aarch64-unknown-linux-gnu
            runner: warp-ubuntu-latest-arm64-4x

    runs-on: ${{ matrix.runner }}
    env:
      # $ORIGIN rpath, duplicated from .cargo/config.toml because RUSTFLAGS env overrides it.
      RUSTFLAGS: ${{ matrix.runner == 'warp-ubuntu-latest-x64-4x' && '-C target-cpu=x86-64-v3 -C link-arg=-Wl,-rpath,$ORIGIN' || '-C link-arg=-Wl,-rpath,$ORIGIN' }}
      # GGML_CPU_ALL_VARIANTS builds armv9.2 CPU variants that compile with -march=…+sme;
      # Ubuntu's default GCC 13 doesn't know +sme (GCC 14 does, and covers the whole ARM
      # variant flag set). Per-target var, so only the aarch64 build uses it — x86 unchanged.
      CC_aarch64_unknown_linux_gnu: gcc-14
      CXX_aarch64_unknown_linux_gnu: g++-14
    steps:
      - uses: actions/checkout@v5

      - name: "Cache Cargo Home"
        # Warp cache — off GitHub's 10 GiB budget (this runs on a Warp runner).
        uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.cargo
            nobodywho/target
          key: ${{ runner.os }}-cargo-home-${{ matrix.integration }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-home-${{ matrix.integration }}-${{ matrix.target }}-release-
      - name: "Setup rust toolchain"
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup update stable
          rustup default stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: "Install Vulkan dependencies for Linux builds"
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake
          sudo apt-get install libshaderc-dev libvulkan-dev glslc

      # GGML_CPU_ALL_VARIANTS' armv9.2 variants compile with -march=…+sme, unsupported by
      # the default GCC 13; GCC 14 knows the full ARM variant flag set (see CC_ env above).
      - name: "Install GCC 14 for aarch64 CPU variants"
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get install -y gcc-14 g++-14

      - name: "Setup Flutter SDK (manual for ARM64)"
        if: matrix.integration == 'flutter' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.35.5 --depth 1
          echo "$PWD/flutter/bin" >> $GITHUB_PATH
          ./flutter/bin/flutter doctor

      - name: "Setup Flutter SDK (action for x64)"
        if: matrix.integration == 'flutter' && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.5

      - name: "Compile for linux"
        run: cargo build -p nobodywho-${{ matrix.integration }} --verbose --target ${{ matrix.target }} --release --locked
        working-directory: ./nobodywho

      - name: "Rename built file"
        run: |
          PROFILE="./nobodywho/target/${{ matrix.target }}/release"
          cp "$PROFILE/libnobodywho_${{ matrix.integration }}.so" ./libnobodywho-${{ matrix.integration }}-${{ matrix.target }}-release.so
          # ggml/llama .so are nested in the build tree, so gather them recursively.
          find "$PROFILE" \( -name 'libggml*.so' -o -name 'libllama*.so' \) ! -type l -exec cp -n {} ./ \;
      - name: "Upload build artifact"
        uses: actions/upload-artifact@v5
        with:
          name: nobodywho-${{ matrix.integration }}-${{ matrix.target }}-release
          path: |
            ./libnobodywho-${{ matrix.integration }}-${{ matrix.target }}-release.so
            ./libggml*.so
            ./libllama*.so
  cargo-build-windows:
    needs: matrix-gen
    if: inputs.run_godot || inputs.run_flutter || inputs.run_kotlin
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - "x86_64-pc-windows-msvc"
        integration: ${{ fromJSON(needs.matrix-gen.outputs.integrations) }}
    env:
      RUSTFLAGS: >-
        -l Advapi32
        -C target-cpu=x86-64-v3
      # Fetch git deps + submodules with the git CLI instead of libgit2. libgit2
      # ignores core.longpaths, so the deeply nested llama.cpp tools/ui/ paths
      # blow past Windows' 260-char MAX_PATH during the submodule checkout. The
      # git CLI honors core.longpaths (set below) and uses \\?\ extended paths.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: "Cache Cargo Home"
        uses: actions/cache@v5
        with:
          # The build moves sources to C:/ and compiles into --target-dir C:/t
          # (see the build step). Cache C:/t, not nobodywho/target (empty here).
          path: |
            ~/.cargo
            C:/t
          key: ${{ runner.os }}-cargo-home-${{ matrix.integration }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-home-${{ matrix.integration }}-${{ matrix.target }}-release-
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.2.5
        with:
          # 1.4.313.2 matches llama.cpp's own Windows Vulkan CI. The newer
          # ggml-vulkan backend does find_package(SPIRV-Headers CONFIG REQUIRED)
          # (llama.cpp PR #22009 / #23215), and SPIRV-HeadersConfig.cmake is only
          # bundled in the SDK from ~1.4.313+. Older SDKs (1.3.296, 1.4.304) lack
          # it, so configure fails. Discovery works via the VULKAN_SDK env var
          # this action sets. stripdown only deletes Demos/Helpers/Licenses/etc.,
          # never the cmake config, so it's safe to keep.
          vulkan_version: 1.4.313.2
          cache: true
          install_runtime: true
          stripdown: true

      - name: Install Ninja
        run: choco install ninja

      - name: Setup Flutter SDK
        if: matrix.integration == 'flutter'
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.5

      - name: Build with Cargo
        # move things into a shortly-named dir in the root, because windows is made by fuckwits who think limiting paths to 260 chars is ok
        run: |
          mv ./nobodywho/* C:/
          # Allow >260-char paths so cargo's git CLI can check out the deep
          # llama.cpp tools/ui/ submodule files (see CARGO_NET_GIT_FETCH_WITH_CLI).
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true
          cd C:/
          # Use an even shorter target directory to avoid path length issues with git dependencies
          cargo build -p nobodywho-${{ matrix.integration }} --target ${{ matrix.target }} --verbose --release --locked --target-dir C:/t
        env:
          NOBODYWHO_SKIP_CODEGEN: "1"
          RUSTFLAGS: >-
            -l Advapi32
            -C debuginfo=0
          # Use Ninja generator instead of Visual Studio generator.
          # This fixes a CMake ExternalProject issue where vulkan-shaders-gen's
          # install step fails to find cmake_install.cmake with the VS generator.
          # Ninja's simpler build structure avoids this problem entirely.
          CMAKE_GENERATOR: "Ninja"

      - name: "Rename built files"
        run: |
          cp C:/t/${{ matrix.target }}/release/nobodywho_${{ matrix.integration }}.dll ./libnobodywho-${{ matrix.integration }}-${{ matrix.target }}-release.dll
          cp C:/t/${{ matrix.target }}/release/nobodywho_${{ matrix.integration }}.pdb ./libnobodywho-${{ matrix.integration }}-${{ matrix.target }}-release.pdb
            ./ggml*.dll
            ./llama*.dll
  cargo-build-macos:
    needs: matrix-gen
    # No run_kotlin: kotlin's CI tests use the Linux uniffi lib and it downloads
    # no macOS artifact; its release dylib comes from swift's build on full runs.
    if: inputs.run_godot || inputs.run_flutter || inputs.run_swift || inputs.run_react_native || inputs.apple_extended
    runs-on: warp-macos-15-arm64-6x
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-gen.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: "Setup Rust toolchain"
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }} || true
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: "Cache Cargo Home"
        # Warp cache — macOS runners are ephemeral now, so a Cargo.lock-keyed
        # cache safely reuses the build instead of compiling cold every run.
        uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.cargo
            nobodywho/target
          key: ${{ runner.os }}-cargo-macos-${{ matrix.integration }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-${{ matrix.integration }}-${{ matrix.target }}-release-

      - name: "Setup Rust nightly for tier 3 targets"
        if: contains(matrix.target, 'visionos') || contains(matrix.target, 'watchos')
        run: |
          rustup toolchain install nightly
          rustup +nightly component add rust-src

      # ORT's build.py uses `match` statements; needs Python 3.10+. Self-hosted mac
      # runner's default python3 may be older. setup-python fails on self-hosted
      # (writes to /Users/runner which doesn't exist), so install via brew.
      - name: "Setup Python for ORT source build"
        if: contains(matrix.target, 'visionos') || contains(matrix.target, 'watchos') || matrix.target == 'x86_64-apple-darwin'
        env:
          # Self-hosted brew was not installed via the official installer, so
          # `brew update` fails with `update-report should not be called
          # directly!`. Skip auto-update — the formula is already pinned.
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install python@3.13
          echo "/opt/homebrew/opt/python@3.13/libexec/bin" >> $GITHUB_PATH

      - name: Setup Flutter SDK
        if: matrix.integration == 'flutter'
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.5

      # Build ORT for targets where pyke ships no prebuilts: x86_64 macOS
      # (MS dropped Intel Mac in 1.20+) and visionOS/watchOS device + sim
      # (no upstream prebuilts anywhere). The action caches by target+version,
      # so reruns hit the cache.
      - name: "Build ONNX Runtime"
        if: matrix.target == 'x86_64-apple-darwin' || contains(matrix.target, 'visionos') || contains(matrix.target, 'watchos')
        id: ort
        uses: ./.github/actions/build-ort
        with:
          target: ${{ matrix.target }}

      - name: "Build (stable targets)"
        if: "!contains(matrix.target, 'visionos') && !contains(matrix.target, 'watchos')"
        run: |
          if [ -n "${{ steps.ort.outputs.lib_path }}" ]; then
            export ORT_LIB_PATH="${{ steps.ort.outputs.lib_path }}"
          fi
          cargo build -p nobodywho-${{ matrix.integration }} --verbose --target ${{ matrix.target }} --release --locked
        working-directory: ./nobodywho
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "18.5"

      - name: "Build (nightly tier 3 targets)"
        if: contains(matrix.target, 'visionos') || contains(matrix.target, 'watchos')
        run: |
          export ORT_LIB_PATH="${{ steps.ort.outputs.lib_path }}"
          # llama.cpp defaults LLAMA_SUBPROCESS ON here: its mobile opt-out lists only
          # iOS/Android/Emscripten, so visionOS/watchOS compile
          # posix_spawn_file_actions_addchdir_np, which those SDKs mark unavailable.
          # subproc.{h,cpp} have a complete no-op path when it is OFF. build.rs forwards
          # CMAKE_*-prefixed env vars to CMake as -D defines.
          echo 'set(LLAMA_SUBPROCESS OFF CACHE BOOL "" FORCE)' > "$RUNNER_TEMP/no-subprocess.cmake"
          export CMAKE_PROJECT_INCLUDE="$RUNNER_TEMP/no-subprocess.cmake"
          TARGET="${{ matrix.target }}"
          # The built-in aarch64-apple-watchos (device) spec has dynamic-linking off,
          # so cargo silently drops the cdylib and emits only a static .a (useless under
          # dynamic-link). watchOS 6+ supports embedded dynamic frameworks, so derive a
          # spec with the flag on. The JSON stem must equal the triple so cargo still
          # emits into target/aarch64-apple-watchos/ (matching the later steps).
          ZFLAGS=""
          if [ "$TARGET" = "aarch64-apple-watchos" ]; then
            rustc +nightly -Z unstable-options --target aarch64-apple-watchos \
              --print target-spec-json \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); d["dynamic-linking"]=True; d.pop("metadata",None); json.dump(d, open("aarch64-apple-watchos.json","w"))'
            TARGET="$(pwd)/aarch64-apple-watchos.json"
            # nightly gates building against a .json target spec behind this flag.
            ZFLAGS="-Z json-target-spec"
          fi
          cargo +nightly build -p nobodywho-${{ matrix.integration }} -Z build-std $ZFLAGS --verbose --target "$TARGET" --release
        working-directory: ./nobodywho

      - name: "Rename built file"
        run: |
          if [ "${{ matrix.integration }}" = "uniffi" ]; then
            # Static library (.a) for xcframeworks (React Native, Swift)
            cp ./nobodywho/target/${{ matrix.target }}/release/libnobodywho_${{ matrix.integration }}.a \
              ./libnobodywho-${{ matrix.integration }}-${{ matrix.target }}-release.a
            # Dynamic library (.dylib) for macOS desktop JNA (Kotlin JVM)
            if [ -f ./nobodywho/target/${{ matrix.target }}/release/libnobodywho_${{ matrix.integration }}.dylib ]; then
              cp ./nobodywho/target/${{ matrix.target }}/release/libnobodywho_${{ matrix.integration }}.dylib \
                ./libnobodywho-${{ matrix.integration }}-${{ matrix.target }}-release.dylib
            fi
          else
            cp ./nobodywho/target/${{ matrix.target }}/release/libnobodywho_${{ matrix.integration }}.dylib \
              ./libnobodywho-${{ matrix.integration }}-${{ matrix.target }}-release.dylib
          fi
          # Ship the ggml/llama dylibs + the dlopen'd backend modules (libggml-*.so, from
          # GGML_BACKEND_DL — co-located next to the binding by core/build.rs) alongside.
          # -L dereferences any symlink. No-op for the .a slices.
          cp -L ./nobodywho/target/${{ matrix.target }}/release/libggml*.dylib ./ 2>/dev/null || true
          cp -L ./nobodywho/target/${{ matrix.target }}/release/libllama*.dylib ./ 2>/dev/null || true
          cp -L ./nobodywho/target/${{ matrix.target }}/release/libggml*.so ./ 2>/dev/null || true

      - name: "Upload build artifact"
        uses: actions/upload-artifact@v5
        with:
          name: nobodywho-${{ matrix.integration }}-${{ matrix.target }}-release
          # wildcard path to match both .dylib and .a
          path: |
            ./libnobodywho-${{ matrix.integration }}-${{ matrix.target }}-release.*
            ./libggml*.dylib
            ./libllama*.dylib
            ./libggml*.so
  # builds an "xcframework"
  # which is an apple thing that contains binaries for multiple systems
  build-flutter-xcframework:
    if: inputs.run_flutter
    runs-on: warp-macos-15-arm64-6x
    needs: [cargo-build-macos]
    steps:
      - uses: actions/checkout@v5

      - name: "Download all build artifacts"
        uses: actions/download-artifact@v5
        with:
          # No merge-multiple: generically-named ggml dylibs would collide across slices.
          pattern: nobodywho-flutter-*-apple-*
          path: artifacts

      - name: Build XCFramework
        run: |
          # No FFI modulemap arg: flutter_rust_bridge links the framework binary directly.
          HELPER=nobodywho/scripts/make-apple-framework.sh
          ios_sim=artifacts/nobodywho-flutter-aarch64-apple-ios-sim-release
          ios_dev=artifacts/nobodywho-flutter-aarch64-apple-ios-release
          dar_arm=artifacts/nobodywho-flutter-aarch64-apple-darwin-release
          dar_x64=artifacts/nobodywho-flutter-x86_64-apple-darwin-release

          bash "$HELPER" "$ios_sim" libnobodywho-flutter-aarch64-apple-ios-sim-release.dylib \
            nobodywho_flutter flat ios-sim ""  ooo.nobodywho.flutter
          bash "$HELPER" "$ios_dev" libnobodywho-flutter-aarch64-apple-ios-release.dylib \
            nobodywho_flutter flat ios-device "" ooo.nobodywho.flutter

          mkdir -p universal-src
          lipo -create -output universal-src/libnobodywho_flutter.dylib \
            "$dar_arm/libnobodywho-flutter-aarch64-apple-darwin-release.dylib" \
            "$dar_x64/libnobodywho-flutter-x86_64-apple-darwin-release.dylib"
          bash nobodywho/scripts/lipo-apple-libs.sh "$dar_arm" "$dar_x64" universal-src
          bash "$HELPER" universal-src libnobodywho_flutter.dylib \
            nobodywho_flutter versioned macos "" ooo.nobodywho.flutter

          xcodebuild -create-xcframework \
                  -framework ios-sim/nobodywho_flutter.framework \
                  -framework macos/nobodywho_flutter.framework \
                  -framework ios-device/nobodywho_flutter.framework \
                  -output nobodywho_flutter.xcframework

      - name: "Zip XCFramework"
        run: zip -y -r nobodywho_flutter.xcframework.zip nobodywho_flutter.xcframework

      - name: "Upload build artifact"
        uses: actions/upload-artifact@v5
        with:
          name: nobodywho-flutter-xcframework
          path: ./nobodywho_flutter.xcframework.zip

  # The Godot addon ships ONE universal ggml/llama set for macOS instead of a per-arch
  # set. Godot resolves .gdextension [dependencies] by first matching tag set, and the
  # arch-less macos.debug/macos.release keys always match before macos.*.arm64, so an
  # arch-split set would pair the arm64 binding with x86_64 dylibs. See the comments in
  # nobodywho/godot/nobodywho.gdextension.
  build-godot-macos-universal:
    if: inputs.full_ci
    runs-on: warp-macos-15-arm64-6x
    needs: [cargo-build-macos]
    steps:
      - uses: actions/checkout@v5

      - name: "Download macOS godot build artifacts"
        uses: actions/download-artifact@v5
        with:
          # No merge-multiple: generically-named ggml dylibs would collide across arches.
          pattern: nobodywho-godot-*-apple-darwin-release
          path: artifacts

      - name: "lipo the ggml/llama dylibs"
        run: |
          # release-only: a debug binding loads the release ggml (same ABI), matching
          # how the release job assembles the addon.
          bash nobodywho/scripts/lipo-apple-libs.sh \
            artifacts/nobodywho-godot-aarch64-apple-darwin-release \
            artifacts/nobodywho-godot-x86_64-apple-darwin-release \
            universal

          # The release job assembles the addon straight from this artifact, so a
          # partial set has to fail here — it cannot be detected downstream.
          # Core DT_NEEDED dylibs + the Metal backend module are present in both arches and
          # must be universal. (libggml-cpu/libggml-metal are no longer dylibs under
          # GGML_BACKEND_DL — they're the modules below.)
          for f in universal/libggml.dylib universal/libggml-base.dylib \
                   universal/libllama.dylib universal/libllama-common.dylib \
                   universal/libggml-metal.so; do
            [ -f "$f" ] || { echo "::error::$f missing — a macOS slice did not build it"; exit 1; }
            lipo -info "$f" | grep -q x86_64 || { echo "::error::$f has no x86_64 slice"; exit 1; }
            lipo -info "$f" | grep -q arm64  || { echo "::error::$f has no arm64 slice"; exit 1; }
          done
          # CPU SIMD-variant modules are per-microarch (single-arch each): arm64 ships
          # libggml-cpu-apple_*.so, x86_64 ships the non-apple variants. Require both sets.
          ls universal/libggml-cpu-apple_*.so >/dev/null 2>&1 \
            || { echo "::error::no arm64 (apple_*) CPU variant modules"; exit 1; }
          ls universal/libggml-cpu-*.so 2>/dev/null | grep -qv apple_ \
            || { echo "::error::no x86_64 CPU variant modules"; exit 1; }

      - name: "Upload build artifact"
        uses: actions/upload-artifact@v5
        with:
          name: nobodywho-godot-macos-universal-dylibs
          path: |
            ./universal/*.dylib
            ./universal/*.so

  # builds an xcframework containing static libraries for React Native iOS
  build-react-native-xcframework:
    if: inputs.run_react_native
    runs-on: warp-macos-15-arm64-6x
    needs: [cargo-build-macos]
    steps:
      - uses: actions/checkout@v5

      - name: "Download uniffi iOS artifacts"
        uses: actions/download-artifact@v5
        with:
          # No merge-multiple: generically-named ggml dylibs would collide across slices.
          pattern: nobodywho-uniffi-*-apple-ios*-release
          path: artifacts

      - name: "Build dynamic-framework XCFramework"
        run: |
          # No FFI modulemap/header: uniffi-bindgen-react-native's generated C++ links
          # the framework binary's symbols directly; CocoaPods `vendored_frameworks` embeds it.
          HELPER=nobodywho/scripts/make-apple-framework.sh
          bash "$HELPER" artifacts/nobodywho-uniffi-aarch64-apple-ios-release \
            libnobodywho-uniffi-aarch64-apple-ios-release.dylib NobodywhoFramework flat device
          bash "$HELPER" artifacts/nobodywho-uniffi-aarch64-apple-ios-sim-release \
            libnobodywho-uniffi-aarch64-apple-ios-sim-release.dylib NobodywhoFramework flat sim
          xcodebuild -create-xcframework \
            -framework device/NobodywhoFramework.framework \
            -framework sim/NobodywhoFramework.framework \
            -output NobodywhoFramework.xcframework

      - name: "Zip XCFramework"
        run: zip -y -r NobodywhoFramework.xcframework.zip NobodywhoFramework.xcframework

      - name: "Upload build artifact"
        uses: actions/upload-artifact@v5
        with:
          name: nobodywho-react-native-xcframework
          path: ./NobodywhoFramework.xcframework.zip

  # builds an xcframework containing static libraries + headers for Swift SPM
  build-swift-xcframework:
    if: inputs.run_swift
    runs-on: warp-macos-15-arm64-6x
    needs: [cargo-build-macos]
    steps:
      - uses: actions/checkout@v5

      - name: "Download uniffi Apple artifacts"
        uses: actions/download-artifact@v5
        with:
          # No merge-multiple: generically-named ggml dylibs would collide across slices.
          pattern: nobodywho-uniffi-*-apple-*-release
          path: artifacts

      - name: "Build dynamic-framework XCFramework"
        run: |
          # The framework module is `nobodywhoFFI` so the generated swift's
          # `import nobodywhoFFI` resolves.
          HELPER=nobodywho/scripts/make-apple-framework.sh
          HDR=nobodywho/swift/generated/nobodywhoFFI.h
          mkslice() { # $1=target $2=layout $3=slice-out-dir
            bash "$HELPER" "artifacts/nobodywho-uniffi-$1-release" \
              "libnobodywho-uniffi-$1-release.dylib" nobodywhoFFI "$2" "$3" "$HDR" ooo.nobodywho.ffi
          }
          mkslice aarch64-apple-ios          flat      ios-device
          mkslice aarch64-apple-ios-sim      flat      ios-sim
          mkslice aarch64-apple-darwin       versioned macos
          mkslice aarch64-apple-visionos     flat      visionos-device
          mkslice aarch64-apple-visionos-sim flat      visionos-sim
          mkslice aarch64-apple-watchos      flat      watchos-device
          mkslice aarch64-apple-watchos-sim  flat      watchos-sim

          xcodebuild -create-xcframework \
            -framework ios-device/nobodywhoFFI.framework \
            -framework ios-sim/nobodywhoFFI.framework \
            -framework macos/nobodywhoFFI.framework \
            -framework visionos-device/nobodywhoFFI.framework \
            -framework visionos-sim/nobodywhoFFI.framework \
            -framework watchos-device/nobodywhoFFI.framework \
            -framework watchos-sim/nobodywhoFFI.framework \
            -output NobodyWhoNative.xcframework
      - name: "Zip XCFramework"
        run: zip -y -r NobodyWhoNative.xcframework.zip NobodyWhoNative.xcframework

      - name: "Upload build artifact"
        uses: actions/upload-artifact@v5
        with:
          name: nobodywho-swift-xcframework
          path: ./NobodyWhoNative.xcframework.zip

  # Runtime smoke test: prove the dynamically-linked ggml/llama graph resolves on a real
  # iOS simulator — rpath/install_name/embedding mistakes surface here, not on a user device.
  apple-runtime-smoke:
    if: inputs.full_ci
    runs-on: warp-macos-15-arm64-6x
    needs: [cargo-build-macos]
    steps:
      - uses: actions/checkout@v5

      - name: "Download iOS simulator uniffi artifact"
        uses: actions/download-artifact@v5
        with:
          # Use `name:` (not `pattern:`): `name:` extracts the artifact's contents
          # directly into `path`, whereas a single-match `pattern` extracts to the path
          # root without a per-artifact subdir, leaving artifacts/<name>/ empty.
          name: nobodywho-uniffi-aarch64-apple-ios-sim-release
          path: artifacts/nobodywho-uniffi-aarch64-apple-ios-sim-release

      - name: "Assemble framework and dlopen it on a booted simulator"
        run: |
          set -euo pipefail
          SRC=artifacts/nobodywho-uniffi-aarch64-apple-ios-sim-release
          bash nobodywho/scripts/make-apple-framework.sh \
            "$SRC" libnobodywho-uniffi-aarch64-apple-ios-sim-release.dylib \
            nobodywhoFFI flat ./smoke nobodywho/swift/generated/nobodywhoFFI.h ooo.nobodywho.ffi

          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun -sdk iphonesimulator clang -target arm64-apple-ios15.0-simulator \
            -isysroot "$SDK" nobodywho/scripts/apple-dlopen-smoke.c -o smoke/dlopen-smoke

          UDID=$(xcrun simctl list devices available | grep -m1 -oE '[0-9A-F-]{36}') || true
          if [ -z "$UDID" ]; then
            RT=$(xcrun simctl list runtimes | grep -m1 -oE 'com.apple.CoreSimulator.SimRuntime.iOS[^ ]*')
            UDID=$(xcrun simctl create smoke-iphone com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$RT")
          fi
          xcrun simctl boot "$UDID" || true

          out=$(xcrun simctl spawn "$UDID" "$PWD/smoke/dlopen-smoke" "$PWD/smoke/nobodywhoFFI.framework/nobodywhoFFI")
          echo "$out"
          # "SMOKE OK" prints only after the backend modules load and a device registers.
          echo "$out" | grep -q "SMOKE OK"

  cargo-build-android:
    needs: matrix-gen
    if: inputs.run_godot || inputs.run_flutter || inputs.run_kotlin || inputs.run_react_native
    runs-on: warp-ubuntu-latest-x64-4x
    strategy:
      fail-fast: false
      matrix:
        target:
          - "aarch64-linux-android"
          - "x86_64-linux-android"
        integration: ${{ fromJSON(needs.matrix-gen.outputs.integrations) }}
    steps:
      - uses: actions/checkout@v5

      - name: "Cache Cargo Home"
        # Warp cache — off GitHub's 10 GiB budget (this runs on a Warp runner).
        uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.cargo
            nobodywho/target
          key: ${{ runner.os }}-cargo-home-${{ matrix.integration }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-home-${{ matrix.integration }}-${{ matrix.target }}-release-
      - name: "Setup rust toolchain"
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: "Install distro dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libshaderc-dev libvulkan-dev glslc gcc-multilib

      - name: "Install Android NDK"
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          add-to-path: false

      - name: Setup Flutter SDK
        if: matrix.integration == 'flutter'
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.5

      # ort-sys has no prebuilt for x86_64-linux-android (pyke only ships arm64).
      # Pull Microsoft's official Android AAR (which has x86_64) and point ort-sys at it.
      # Version must match ort-sys's pyke distribution (ms@1.24.2 — see ort-sys/build/download/dist.txt).
      - name: "Fetch ONNX Runtime for x86_64-linux-android"
        if: matrix.target == 'x86_64-linux-android'
        id: ort-android
        run: |
          ORT_VERSION=1.24.2
          ORT_DIR="$RUNNER_TEMP/ort-android-x86_64/lib"
          mkdir -p "$ORT_DIR"
          curl -L --fail -o /tmp/onnxruntime.aar \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ORT_VERSION}/onnxruntime-android-${ORT_VERSION}.aar"
          unzip -j -o /tmp/onnxruntime.aar 'jni/x86_64/libonnxruntime.so' -d "$ORT_DIR"
          echo "ort_dir=$ORT_DIR" >> "$GITHUB_OUTPUT"

      - name: "Compile for android"
        # ORT_LIB_PATH/ORT_PREFER_DYNAMIC_LINK only set when ort-android step ran (x86_64);
        # exporting them empty on arm64 would put ort-sys into manual-link mode with no path.
        run: |
          if [ "${{ matrix.target }}" = "x86_64-linux-android" ]; then
            export ORT_LIB_PATH="${{ steps.ort-android.outputs.ort_dir }}"
            export ORT_PREFER_DYNAMIC_LINK=1
          fi
          cargo build -p nobodywho-${{ matrix.integration }} --verbose --target ${{ matrix.target }} --release --locked
        working-directory: ./nobodywho
        env:
          ANDROID_NDK: "${{ steps.setup-ndk.outputs.ndk-path }}"
          # aarch64 (arm64-v8a)
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_AR: "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          CC_aarch64_linux_android: "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          CXX_aarch64_linux_android: "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang++"
          AR_aarch64_linux_android: "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          # x86_64
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang"
          CARGO_TARGET_X86_64_LINUX_ANDROID_AR: "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          CC_x86_64_linux_android: "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android31-clang"
          CXX_x86_64_linux_android: "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android31-clang++"
          AR_x86_64_linux_android: "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

        # XXX: .so files for android in godot MUST start with "lib"
      - name: "Rename built file"
        run: |
          if [ "${{ matrix.integration }}" = "uniffi" ]; then
            # uniffi produces both static (.a) for React Native/Swift and shared (.so) for Kotlin/JNA
            cp ./nobodywho/target/${{ matrix.target }}/release/libnobodywho_${{ matrix.integration }}.a \
              ./libnobodywho-${{ matrix.integration }}-${{ matrix.target }}-release.a
            cp ./nobodywho/target/${{ matrix.target }}/release/libnobodywho_${{ matrix.integration }}.so \
              ./libnobodywho-${{ matrix.integration }}-${{ matrix.target }}-release.so
          else
            cp ./nobodywho/target/${{ matrix.target }}/release/libnobodywho_${{ matrix.integration }}.so \
              ./libnobodywho-${{ matrix.integration }}-${{ matrix.target }}-release.so
          fi
          # x86_64 Android links dynamically against libonnxruntime.so — ship it alongside.
          if [ "${{ matrix.target }}" = "x86_64-linux-android" ]; then
            cp "${{ steps.ort-android.outputs.ort_dir }}/libonnxruntime.so" ./libonnxruntime.so
          fi
          # ggml/llama .so are nested in the build tree; gather recursively (Android loads them from jniLibs/<abi>).
          PROFILE="./nobodywho/target/${{ matrix.target }}/release"
          find "$PROFILE" \( -name 'libggml*.so' -o -name 'libllama*.so' \) ! -type l -exec cp -n {} ./ \;

      - name: "Upload build artifact"
        uses: actions/upload-artifact@v5
        with:
          name: nobodywho-${{ matrix.integration }}-${{ matrix.target }}-release
          path: |
            ./libnobodywho-${{ matrix.integration }}-${{ matrix.target }}-release.*
            ./libonnxruntime.so
            ./libggml*.so
            ./libllama*.so
