name: "C# CI"

# Gated by build-and-test.yml on needs.plan.outputs.run_csharp — the workflow
# itself has no input; it only runs when the plan job says csharp is in scope.
on: workflow_call

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs everything, including the model-backed integration tests.
          - os: linux
            runner: warp-ubuntu-latest-x64-4x
            target: x86_64-unknown-linux-gnu
            lib: libnobodywho_uniffi.so
            ext: so
            models: true
          # Windows and macOS run the tests that need no model, which still load
          # and call into the native library on that platform.
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            lib: nobodywho_uniffi.dll
            ext: dll
            models: false
          - os: macos
            runner: warp-macos-15-arm64-6x
            target: aarch64-apple-darwin
            lib: libnobodywho_uniffi.dylib
            ext: dylib
            models: false
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: "Download uniffi ${{ matrix.target }} artifact"
        uses: actions/download-artifact@v5
        with:
          name: nobodywho-uniffi-${{ matrix.target }}-release
          path: ./native-lib

      - name: "Rename native lib"
        run: |
          cp ./native-lib/libnobodywho-uniffi-${{ matrix.target }}-release.${{ matrix.ext }} \
            ./native-lib/${{ matrix.lib }}

      - name: "Install Vulkan runtime"
        if: matrix.os == 'linux'
        # The .so links libvulkan.
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1

      - name: "Install Vulkan runtime"
        if: matrix.os == 'windows'
        # The .dll links vulkan-1.dll, which GPU drivers provide but CI runners lack.
        uses: jakoch/install-vulkan-sdk-action@v1.2.5
        with:
          vulkan_version: 1.4.313.2
          cache: true
          install_runtime: true
          stripdown: true

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: nobodywho/csharp/global.json

      - name: "Check formatting"
        if: matrix.os == 'linux'
        working-directory: ./nobodywho/csharp
        run: dotnet format NobodyWho.slnx --verify-no-changes

      - name: "Build"
        working-directory: ./nobodywho/csharp
        run: dotnet build NobodyWho.slnx -p:NobodyWhoNativeLib="${{ github.workspace }}/native-lib/${{ matrix.lib }}"

      - name: "Download test models"
        if: matrix.models
        run: |
          mkdir -p test-models
          curl -L --fail -o test-models/model.gguf \
            "https://huggingface.co/NobodyWho/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen_Qwen3-0.6B-Q4_K_M.gguf"
          curl -L --fail -o test-models/embeddings.gguf \
            "https://huggingface.co/CompendiumLabs/bge-small-en-v1.5-gguf/resolve/main/bge-small-en-v1.5-q8_0.gguf"

      - name: "Run tests"
        working-directory: ./nobodywho/csharp
        env:
          TEST_MODEL: ${{ matrix.models && format('{0}/test-models/model.gguf', github.workspace) || '' }}
          TEST_EMBEDDINGS_MODEL: ${{ matrix.models && format('{0}/test-models/embeddings.gguf', github.workspace) || '' }}
        run: dotnet test --no-build

      - name: "Pack"
        if: matrix.os == 'linux'
        working-directory: ./nobodywho/csharp
        run: dotnet pack src/NobodyWho -o ../../nupkg
