name: "plan"

# Reads event, labels, and changed paths and emits a `run_*` boolean per CI
# bucket. Every other workflow gates on these outputs. This is the only place
# that knows about routing — child workflows just consume their input.

on:
  workflow_call:
    inputs:
      dispatch_full_ci:
        description: "True when build-and-test.yml was invoked via workflow_dispatch with full_ci=true."
        type: boolean
        default: false
      dispatch_buckets:
        description: "Space-separated bucket keys to force on (from a /<bucket>-ci PR comment)."
        type: string
        default: ""
    outputs:
      run_rust_core:
        value: ${{ jobs.plan.outputs.run_rust_core }}
      run_python:
        value: ${{ jobs.plan.outputs.run_python }}
      run_python_models:
        value: ${{ jobs.plan.outputs.run_python_models }}
      run_godot:
        value: ${{ jobs.plan.outputs.run_godot }}
      run_flutter:
        value: ${{ jobs.plan.outputs.run_flutter }}
      run_swift:
        value: ${{ jobs.plan.outputs.run_swift }}
      run_kotlin:
        value: ${{ jobs.plan.outputs.run_kotlin }}
      run_react_native:
        value: ${{ jobs.plan.outputs.run_react_native }}
      run_apple_extended:
        # visionOS/watchOS uniffi builds (nightly rust, ORT from source).
        # Expensive, so full runs only — or on demand via /apple-extended-ci.
        value: ${{ jobs.plan.outputs.run_apple_extended }}
      run_docs:
        value: ${{ jobs.plan.outputs.run_docs }}
      run_regen:
        value: ${{ jobs.plan.outputs.run_regen }}
      run_release:
        value: ${{ jobs.plan.outputs.run_release }}
      run_android_candidates:
        value: ${{ jobs.plan.outputs.run_android_candidates }}
      device_uses_android_candidates:
        value: ${{ jobs.plan.outputs.device_uses_android_candidates }}
      device_jobs:
        # Selector for mobile-device-tests.yml (e.g. "kotlin-source", "all");
        # empty means none.
        value: ${{ jobs.plan.outputs.device_jobs }}
      is_full:
        # True on the "run everything" triggers (push to main, tag, dispatch
        # full_ci, full-ci label). Consumers use it to gate expensive work
        # (e.g. visionOS/watchOS) to full runs only.
        value: ${{ jobs.plan.outputs.is_full }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run_rust_core:      ${{ steps.decide.outputs.run_rust_core }}
      run_python:         ${{ steps.decide.outputs.run_python }}
      run_python_models:  ${{ steps.decide.outputs.run_python_models }}
      run_godot:          ${{ steps.decide.outputs.run_godot }}
      run_flutter:        ${{ steps.decide.outputs.run_flutter }}
      run_swift:          ${{ steps.decide.outputs.run_swift }}
      run_kotlin:         ${{ steps.decide.outputs.run_kotlin }}
      run_react_native:   ${{ steps.decide.outputs.run_react_native }}
      run_apple_extended: ${{ steps.decide.outputs.run_apple_extended }}
      run_docs:           ${{ steps.decide.outputs.run_docs }}
      run_regen:          ${{ steps.decide.outputs.run_regen }}
      run_release:        ${{ steps.decide.outputs.run_release }}
      run_android_candidates: ${{ steps.decide.outputs.run_android_candidates }}
      device_uses_android_candidates: ${{ steps.decide.outputs.device_uses_android_candidates }}
      device_jobs:        ${{ steps.decide.outputs.device_jobs }}
      is_full:            ${{ steps.decide.outputs.is_full }}
    steps:
      # fetch-depth: 0 is required so the `git diff` below can reach an
      # arbitrary base SHA (github.event.before for a synchronize push). With
      # the default shallow clone the base commit is unreachable and the diff
      # would fail.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Diagnostic line: surfaces the event, action, and base SHA in the job
      # summary so odd CI routing can be read directly instead of guessed.
      - name: "Echo event diagnostics"
        run: |
          echo "event:    ${{ github.event_name }}"
          echo "action:   ${{ github.event.action }}"
          echo "ref:      ${{ github.ref }}"
          echo "draft:    ${{ github.event.pull_request.draft }}"
          echo "before:   ${{ github.event.before }}"
          echo "after:    ${{ github.event.after }}"
          {
            echo "## Event diagnostics"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| event | \`${{ github.event_name }}\` |"
            echo "| action | \`${{ github.event.action }}\` |"
            echo "| ref | \`${{ github.ref }}\` |"
            echo "| draft | \`${{ github.event.pull_request.draft }}\` |"
            echo "| before | \`${{ github.event.before || '(empty)' }}\` |"
            echo "| after | \`${{ github.event.after || '(empty)' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Compute the changed-file list ourselves with `git diff`.
      # Diff base by event:
      #   - PR synchronize: base = github.event.before → just that push (incremental).
      #   - PR opened/reopened/labeled: no "before", so base = PR base SHA.
      #   - push to main: base = github.event.before of the push.
      #   - workflow_dispatch / tag: skipped (decide forces everything).
      - name: "Detect changed paths"
        id: paths
        run: |
          set -uo pipefail

          BASE=""
          HEAD=""

          case "${{ github.event_name }}" in
            pull_request)
              ACTION="${{ github.event.action }}"
              EVT_BEFORE="${{ github.event.before }}"
              PR_BASE_SHA="${{ github.event.pull_request.base.sha }}"
              PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
              HEAD="$PR_HEAD_SHA"
              # synchronize = a new push: diff just that push (incremental). But
              # a force-push/rebase orphans `before` (unreachable in the fetched
              # history), and opened/reopened have no `before` — in both cases
              # fall back to the PR base SHA (always reachable via the merge ref).
              if [[ "$ACTION" == "synchronize" && -n "$EVT_BEFORE" ]] \
                 && git cat-file -e "${EVT_BEFORE}^{commit}" 2>/dev/null; then
                BASE="$EVT_BEFORE"
              else
                BASE="$PR_BASE_SHA"
              fi
              ;;
            push)
              if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
                BASE="${{ github.event.before }}"
                HEAD="${{ github.event.after }}"
              fi
              ;;
          esac

          if [[ -n "$BASE" ]] && [[ -n "$HEAD" ]]; then
            echo "Diffing $BASE..$HEAD"
            CHANGED="$(git diff --name-only "$BASE..$HEAD" 2>&1)"
            git_rc=$?
            if [[ $git_rc -ne 0 ]]; then
              echo "::warning::git diff failed (exit $git_rc); treating as no changes"
              CHANGED=""
            fi
          else
            echo "No diff base; treating as no changes"
            CHANGED=""
          fi

          echo "---- Changed files ----"
          if [[ -z "$CHANGED" ]]; then echo "(none)"; else echo "$CHANGED"; fi
          echo "-----------------------"

          contains() {
            [[ -n "$CHANGED" ]] && echo "$CHANGED" | grep -qE "$1"
          }
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          # Emit one p_* per filter, mirroring the names the decide step reads.
          contains '^nobodywho/core/'        && out core         true || out core         false
          if contains '^nobodywho/(android/|\.cargo/config\.toml$|core/build\.rs$|core/cmake/llama-build-overrides\.cmake$)'; then
            out android true
          else
            out android false
          fi
          contains '^nobodywho/uniffi/'      && out uniffi       true || out uniffi       false
          contains '^nobodywho/python/'      && out python       true || out python       false
          contains '^nobodywho/godot/'       && out godot        true || out godot        false
          contains '^nobodywho/flutter/'     && out flutter      true || out flutter      false
          contains '^nobodywho/swift/'       && out swift        true || out swift        false
          contains '^nobodywho/kotlin/'      && out kotlin       true || out kotlin       false
          contains '^nobodywho/react-native/' && out react_native true || out react_native false
          contains '^docs/'                  && out docs         true || out docs         false
          # regen-drift surface: anything that can change generated bindings/stubs.
          contains '^nobodywho/(core/|uniffi/|grammar/|Cargo\.(toml|lock)$|swift/generated/|swift/Package\.swift$|kotlin/common/generated/|kotlin/.*\.gradle\.kts$|react-native/generated/|react-native/package(-lock)?\.json$)' && out regen true || out regen false

          {
            echo "## Path detection"
            echo
            echo "Base: \`${BASE:-(none)}\`  ·  Head: \`${HEAD:-(none)}\`"
            echo
            if [[ -z "$CHANGED" ]]; then
              echo "Changed files: _none_"
            else
              echo "Changed files:"
              echo
              echo '```'
              echo "$CHANGED"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Decide which buckets to run"
        id: decide
        env:
          EVENT:            ${{ github.event_name }}
          REF:              ${{ github.ref }}
          LABELS:           ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCH_FULL_CI: ${{ inputs.dispatch_full_ci }}
          DISPATCH_BUCKETS: ${{ inputs.dispatch_buckets }}
          P_CORE:           ${{ steps.paths.outputs.core }}
          P_ANDROID:        ${{ steps.paths.outputs.android }}
          P_UNIFFI:         ${{ steps.paths.outputs.uniffi }}
          P_PYTHON:         ${{ steps.paths.outputs.python }}
          P_GODOT:          ${{ steps.paths.outputs.godot }}
          P_FLUTTER:        ${{ steps.paths.outputs.flutter }}
          P_SWIFT:          ${{ steps.paths.outputs.swift }}
          P_KOTLIN:         ${{ steps.paths.outputs.kotlin }}
          P_RN:             ${{ steps.paths.outputs.react_native }}
          P_DOCS:           ${{ steps.paths.outputs.docs }}
          P_REGEN:          ${{ steps.paths.outputs.regen }}
        run: |
          set -euo pipefail

          # Returns "true" if any positional arg equals "true".
          any() {
            for v in "$@"; do
              if [[ "$v" == "true" ]]; then echo true; return; fi
            done
            echo false
          }
          has_label() { echo "${LABELS:-[]}" | grep -q "\"$1\""; }

          # Normalize path outputs (may be empty when no diff ran).
          p_core="${P_CORE:-false}"
          p_android="${P_ANDROID:-false}"
          p_uniffi="${P_UNIFFI:-false}"
          p_python="${P_PYTHON:-false}"
          p_godot="${P_GODOT:-false}"
          p_flutter="${P_FLUTTER:-false}"
          p_swift="${P_SWIFT:-false}"
          p_kotlin="${P_KOTLIN:-false}"
          p_rn="${P_RN:-false}"
          p_docs="${P_DOCS:-false}"
          p_regen="${P_REGEN:-false}"

          # ---- full CI (everything) ----------------------------------------
          # A normal PR push never lands here — it runs only the buckets whose
          # own paths changed. Full CI is the post-merge / opt-in gates:
          everything=false
          if [[ "$EVENT" == "push" && "$REF" == "refs/heads/main" ]]; then everything=true; fi  # post-merge canonical run
          if [[ "$REF" == refs/tags/nobodywho-* ]]; then everything=true; fi   # release tag
          if [[ "$DISPATCH_FULL_CI" == "true" ]]; then everything=true; fi      # workflow_dispatch full_ci
          if has_label "full-ci"; then everything=true; fi                      # opt-in label / /full-ci

          # ---- per-bucket decisions ----------------------------------------
          # Path-gated, no cascade — except uniffi/** → swift/kotlin/RN, which
          # consume its generated FFI. core/** is core coverage → rust_core +
          # the tool-calling matrix (python_models below), not the bindings.
          run_rust_core=$(any "$everything" "$p_core")
          run_python=$(any "$everything" "$p_python")
          run_godot=$(any "$everything" "$p_godot")
          run_flutter=$(any "$everything" "$p_android" "$p_flutter")
          run_swift=$(any "$everything" "$p_uniffi" "$p_swift")
          run_kotlin=$(any "$everything" "$p_android" "$p_uniffi" "$p_kotlin")
          run_react_native=$(any "$everything" "$p_android" "$p_uniffi" "$p_rn")

          # python_models: tool-calling matrix (core coverage) — runs on any core change.
          run_python_models=false
          if [[ "$everything" == "true" ]] || [[ "$p_core" == "true" ]]; then
            run_python_models=true
          fi

          # regen-checks: only when the generated-binding surface changed (or full run).
          run_regen=$(any "$everything" "$p_regen")

          # apple_extended: visionOS/watchOS tier-3 targets (nightly rust +
          # -Z build-std, ORT from source). Never path-triggered — too slow to
          # run on every core/uniffi change. Full runs, or /apple-extended-ci.
          run_apple_extended="$everything"

          # workflow_dispatch with an explicit bucket list (a /<bucket>-ci PR
          # comment): force exactly those buckets on. Paths are empty on a
          # dispatch, so this is the sole selector.
          if [[ -n "${DISPATCH_BUCKETS:-}" ]]; then
            has_bucket() { [[ " $DISPATCH_BUCKETS " == *" $1 "* ]]; }
            has_bucket rust_core     && run_rust_core=true     || true
            has_bucket python        && run_python=true        || true
            has_bucket python_models && run_python_models=true || true
            has_bucket godot         && run_godot=true         || true
            has_bucket flutter       && run_flutter=true       || true
            has_bucket swift         && run_swift=true         || true
            has_bucket kotlin        && run_kotlin=true        || true
            has_bucket react_native  && run_react_native=true  || true
            has_bucket regen         && run_regen=true         || true
            # Stands alone: builds only the 4 tier-3 slices, no swift matrix.
            has_bucket apple_extended && run_apple_extended=true || true
          fi

          # docs: on a full run or a docs/** change. The docs job is ref-gated
          # to main, so this only actually deploys on a push to main.
          run_docs=$(any "$everything" "$p_docs")

          # release: only on a release tag.
          run_release=false
          if [[ "$REF" == refs/tags/nobodywho-* ]]; then run_release=true; fi

          # ---- on-device tests (Firebase Test Lab) --------------------------
          # Deliberately NOT tied to $everything: these run on real phones and
          # bill per device-minute, so a push to main must not trigger them.
          # Main is covered by the nightly schedule in mobile-device-tests.yml.
          # They run here only when a release tag needs gating, or when someone
          # explicitly asks via a /<binding>-device-<source|released>-ci comment.
          device_jobs=""
          add_device() { device_jobs="${device_jobs:+$device_jobs,}$1"; }

          # A binding release must prove that binding on hardware. The shared
          # Android-native release feeds all three bindings, so gate it on all
          # three source-package tests.
          case "$REF" in
            refs/tags/nobodywho-android-v*)        add_device kotlin-source; add_device flutter-source; add_device react-native-source ;;
            refs/tags/nobodywho-kotlin-v*)       add_device kotlin-source ;;
            refs/tags/nobodywho-flutter-v*)      add_device flutter-source ;;
            refs/tags/nobodywho-react-native-v*) add_device react-native-source ;;
          esac

          if [[ -n "${DISPATCH_BUCKETS:-}" ]]; then
            if has_bucket device_all; then
              device_jobs="all"
            else
              has_bucket device_kotlin_source        && add_device kotlin-source        || true
              has_bucket device_kotlin_released      && add_device kotlin-released      || true
              has_bucket device_flutter_source       && add_device flutter-source       || true
              has_bucket device_flutter_released     && add_device flutter-released     || true
              has_bucket device_react_native_source  && add_device react-native-source  || true
              has_bucket device_react_native_released && add_device react-native-released || true
            fi
          fi

          # Source tests normally exercise the native candidate from this run.
          # A binding release is different: its package must resolve the native
          # Maven version it actually declares, otherwise a stale or missing pin
          # can be hidden by placing the branch AAR under that coordinate.
          device_uses_android_candidates=false
          if [[ "$device_jobs" == "all" || "$device_jobs" == "source" || ",$device_jobs," == *"-source,"* ]]; then
            case "$REF" in
              refs/tags/nobodywho-kotlin-v*|refs/tags/nobodywho-flutter-v*|refs/tags/nobodywho-react-native-v*) ;;
              *) device_uses_android_candidates=true ;;
            esac
          fi

          # Package native Android candidates whenever the Android-native
          # surface is receiving full binding coverage, or whenever a source
          # device test explicitly needs an exact candidate AAR.
          run_android_candidates=false
          if [[ "$run_flutter" == "true" && "$run_kotlin" == "true" && "$run_react_native" == "true" ]] || \
             [[ "$device_jobs" == "all" || "$device_jobs" == "source" || ",$device_jobs," == *"-source,"* ]]; then
            run_android_candidates=true
          fi

          # ---- emit --------------------------------------------------------
          {
            echo "run_rust_core=$run_rust_core"
            echo "run_python=$run_python"
            echo "run_python_models=$run_python_models"
            echo "run_godot=$run_godot"
            echo "run_flutter=$run_flutter"
            echo "run_swift=$run_swift"
            echo "run_kotlin=$run_kotlin"
            echo "run_react_native=$run_react_native"
            echo "run_apple_extended=$run_apple_extended"
            echo "run_docs=$run_docs"
            echo "run_regen=$run_regen"
            echo "run_release=$run_release"
            echo "run_android_candidates=$run_android_candidates"
            echo "device_uses_android_candidates=$device_uses_android_candidates"
            echo "device_jobs=$device_jobs"
            echo "is_full=$everything"
          } >> "$GITHUB_OUTPUT"

          # ---- run summary -------------------------------------------------
          {
            echo "## CI Plan"
            echo
            echo "Event: \`$EVENT\`  ·  Ref: \`$REF\`  ·  full-everything: \`$everything\`"
            echo
            echo "| bucket | run? |"
            echo "|---|---|"
            echo "| rust_core | $run_rust_core |"
            echo "| python | $run_python |"
            echo "| python_models | $run_python_models |"
            echo "| godot | $run_godot |"
            echo "| flutter | $run_flutter |"
            echo "| swift | $run_swift |"
            echo "| kotlin | $run_kotlin |"
            echo "| react_native | $run_react_native |"
            echo "| apple_extended | $run_apple_extended |"
            echo "| regen | $run_regen |"
            echo "| docs | $run_docs |"
            echo "| release | $run_release |"
            echo "| Android candidates | $run_android_candidates |"
            echo "| device tests use Android candidates | $device_uses_android_candidates |"
            echo "| device tests | ${device_jobs:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"
