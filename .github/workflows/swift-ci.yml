name: "Swift CI"

# Called by build.yml as soon as the Swift xcframework is ready.
on: workflow_call

permissions:
  actions: write
  contents: read

jobs:
  tests:
    runs-on: warp-macos-15-arm64-6x
    steps:
      - uses: actions/checkout@v5

      - name: "Download xcframework artifact"
        uses: actions/download-artifact@v5
        with:
          name: nobodywho-swift-xcframework
          path: ./xcframework-zip

      - name: "Install xcframework"
        run: |
          mkdir -p nobodywho/swift/Frameworks
          unzip -o xcframework-zip/NobodyWhoNative.xcframework.zip -d nobodywho/swift/Frameworks/
          ls -la nobodywho/swift/Frameworks/NobodyWhoNative.xcframework/

      - name: "Cache SwiftPM build"
        # swift-syntax (macros) is a multi-minute compile; cache the SwiftPM
        # build dir so it's reused across runs (Warp — non-Windows runner).
        uses: WarpBuilds/cache@v1
        with:
          path: |
            nobodywho/swift/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('nobodywho/swift/Package.resolved', 'nobodywho/swift/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: "Run macro tests"
        working-directory: ./nobodywho/swift
        run: swift test --filter MacroTests

      - name: Cache test models
        uses: WarpBuilds/cache@v2
        with:
          path: test-models/
          key: test-models-swift-${{ hashFiles('.github/workflows/swift-ci.yml') }}

      - name: "Download test models"
        timeout-minutes: 20
        run: |
          source .github/scripts/download-model.sh
          download_model --output test-models/model.gguf \
            --url "https://huggingface.co/NobodyWho/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen_Qwen3-0.6B-Q4_K_M.gguf"
          download_model --output test-models/vision-model.gguf \
            --url "https://huggingface.co/unsloth/gemma-3-4b-it-GGUF/resolve/main/gemma-3-4b-it-Q4_K_M.gguf"
          download_model --output test-models/mmproj.gguf \
            --url "https://huggingface.co/unsloth/gemma-3-4b-it-GGUF/resolve/main/mmproj-F16.gguf"
          # fp32 files match the tests' quantization="default".
          WHISPER_BASE="https://huggingface.co/onnx-community/whisper-base/resolve/main"
          for file in onnx/encoder_model.onnx onnx/decoder_model_merged.onnx tokenizer.json generation_config.json config.json preprocessor_config.json; do
            download_model --url "$WHISPER_BASE/$file" --output "test-models/whisper-base/$file"
          done

      - name: "Run integration tests"
        working-directory: ./nobodywho/swift
        env:
          TEST_MODEL: ${{ github.workspace }}/test-models/model.gguf
          TEST_VISION_MODEL: ${{ github.workspace }}/test-models/vision-model.gguf
          TEST_MMPROJ: ${{ github.workspace }}/test-models/mmproj.gguf
          TEST_WHISPER_MODEL: ${{ github.workspace }}/test-models/whisper-base
          TEST_AUDIO_FILE: ${{ github.workspace }}/assets/sound.mp3
        run: swift test --filter NobodyWhoTests
      - name: Cancel this CI run on failure
        if: >-
          failure() &&
          github.workflow == 'Build and test' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.actions.cancelWorkflowRun({
                ...context.repo,
                run_id: context.runId,
              });
            } catch (error) {
              if (error.status !== 409) throw error;
              core.info('Cancellation was already requested or the run has finished.');
            }
