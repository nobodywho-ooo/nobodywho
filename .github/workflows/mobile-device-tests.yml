name: "Mobile Device Tests"

# Runs each binding's on-device test suite on real phones via Firebase Test Lab.
# Triggers: nightly on `main`, a workflow_dispatch for any single job, or a call
# from build-and-test.yml (release gating and /<binding>-device-<mode>-ci PR
# comments). A failed test = a red run; there is intentionally no extra
# notification layer.
#
# Every binding gets two jobs:
#   <binding>-source     first creates the binding's local release candidate,
#                        then installs that candidate in the device app. Normal
#                        source runs resolve this run's native AAR from a local
#                        Maven directory. Binding release tags instead resolve
#                        the native version declared by the candidate package.
#                        Nothing is uploaded to a package registry.
#   <binding>-released   builds against the published package, exactly as a
#                        consumer does. A failure here means what we already
#                        shipped is broken, and the fix belongs in the library —
#                        never in the test app, which is deliberately kept as
#                        simple as any consumer's app.
#
# Auth is keyless via Workload Identity Federation. Requires three repo secrets:
#   GCP_PROJECT_ID, GCP_SERVICE_ACCOUNT, GCP_WORKLOAD_IDENTITY_PROVIDER
on:
  # Nightly. GitHub only runs scheduled workflows on the default branch, so this
  # is the canonical "does main still work on real hardware" run.
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      jobs:
        description: "Which device-test job(s) to run"
        type: choice
        default: all
        options:
          - all
          - source        # every binding, built from this repo
          - released      # every binding, from its published package
          - kotlin-source
          - kotlin-released
          - flutter-source
          - flutter-released
          - react-native-source
          - react-native-released
      device:
        description: "Which device(s) to run on"
        type: choice
        default: both
        options:
          - both
          - pixel8-mali
          - s24ultra-adreno
      test_timeout:
        description: "Per-device test timeout (e.g. 30m)"
        type: string
        default: "30m"

  # Called from build-and-test.yml, so a release can be gated on its binding's
  # device job and so /<binding>-device-ci comments can reach these jobs.
  workflow_call:
    inputs:
      jobs:
        description: "Comma-separated job names, or all/source/released"
        type: string
        default: all
      device:
        type: string
        default: both
      test_timeout:
        type: string
        default: "30m"
      candidate_aars_prebuilt:
        description: "The caller already uploaded nobodywho-android-candidate-aars"
        type: boolean
        default: false
      native_dependency_mode:
        description: "candidate uses this run's AAR; released resolves the binding's declared Maven version"
        type: string
        default: candidate
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  # Resolves the `jobs` input into one boolean per job, so each job carries a
  # plain condition instead of repeating the selection logic six times.
  select:
    runs-on: ubuntu-latest
    outputs:
      kotlin_source: ${{ steps.pick.outputs.kotlin_source }}
      kotlin_released: ${{ steps.pick.outputs.kotlin_released }}
      flutter_source: ${{ steps.pick.outputs.flutter_source }}
      flutter_released: ${{ steps.pick.outputs.flutter_released }}
      react_native_source: ${{ steps.pick.outputs.react_native_source }}
      react_native_released: ${{ steps.pick.outputs.react_native_released }}
      use_native_candidates: ${{ steps.pick.outputs.use_native_candidates }}
    steps:
      - id: pick
        env:
          # Empty on a schedule event, where everything should run.
          SELECTION: ${{ inputs.jobs || 'all' }}
          NATIVE_DEPENDENCY_MODE: ${{ inputs.native_dependency_mode || 'candidate' }}
        run: |
          set -euo pipefail
          sel="${SELECTION:-all}"
          case "$NATIVE_DEPENDENCY_MODE" in
            candidate) use_native_candidates=true ;;
            released) use_native_candidates=false ;;
            *)
              echo "::error::unknown native dependency mode '$NATIVE_DEPENDENCY_MODE'; expected candidate or released"
              exit 1
              ;;
          esac
          # $1 = job name, $2 = group. Whole-token match, so selecting
          # "kotlin-source" never also selects "kotlin-released".
          want() {
            if [[ ",$sel," == *",all,"* || ",$sel," == *",$2,"* || ",$sel," == *",$1,"* ]]; then
              echo true
            else
              echo false
            fi
          }
          {
            echo "kotlin_source=$(want kotlin-source source)"
            echo "kotlin_released=$(want kotlin-released released)"
            echo "flutter_source=$(want flutter-source source)"
            echo "flutter_released=$(want flutter-released released)"
            echo "react_native_source=$(want react-native-source source)"
            echo "react_native_released=$(want react-native-released released)"
            echo "use_native_candidates=$use_native_candidates"
          } >> "$GITHUB_OUTPUT"

  # A direct schedule/workflow_dispatch has no parent build job. Build and
  # package the same candidates here; callers such as build-and-test.yml set
  # candidate_aars_prebuilt after doing these jobs themselves.
  build-source-native-candidates:
    needs: select
    if: >-
      !inputs.candidate_aars_prebuilt &&
      needs.select.outputs.use_native_candidates == 'true' &&
      (
        needs.select.outputs.kotlin_source == 'true' ||
        needs.select.outputs.flutter_source == 'true' ||
        needs.select.outputs.react_native_source == 'true'
      )
    uses: ./.github/workflows/build.yml
    with:
      android_native: true

  package-source-native-candidates:
    needs: [select, build-source-native-candidates]
    if: >-
      always() &&
      !inputs.candidate_aars_prebuilt &&
      needs.select.outputs.use_native_candidates == 'true' &&
      (
        needs.select.outputs.kotlin_source == 'true' ||
        needs.select.outputs.flutter_source == 'true' ||
        needs.select.outputs.react_native_source == 'true'
      ) &&
      needs.build-source-native-candidates.result == 'success'
    uses: ./.github/workflows/package-android-candidates.yml

  # ---------------------------------------------------------------- Kotlin ---
  kotlin-source:
    needs: [select, package-source-native-candidates]
    if: >-
      always() &&
      needs.select.outputs.kotlin_source == 'true' &&
      (
        needs.select.outputs.use_native_candidates != 'true' ||
        inputs.candidate_aars_prebuilt ||
        needs.package-source-native-candidates.result == 'success'
      )
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: "Download tested Android candidates"
        if: needs.select.outputs.use_native_candidates == 'true'
        uses: actions/download-artifact@v5
        with:
          name: nobodywho-android-candidate-aars
          path: ./android-candidates

      # The packaged Kotlin binding keeps its normal Maven dependency. This
      # action makes the tested AAR available at that coordinate only inside
      # the runner; it does not set the binding's native-AAR file override.
      - name: "Stage UniFFI candidate for Maven resolution"
        if: needs.select.outputs.use_native_candidates == 'true'
        uses: ./.github/actions/stage-android-candidate-repository
        with:
          integration: uniffi
          candidates-path: android-candidates
          version-source: nobodywho/kotlin/android/build.gradle.kts

      # In released-native mode the staging action above is skipped, but the
      # Kotlin binding candidate still needs a runner-local publication target.
      - name: "Prepare the Kotlin candidate repository"
        if: needs.select.outputs.use_native_candidates != 'true'
        run: |
          REPOSITORY="$RUNNER_TEMP/nobodywho-candidate-maven"
          mkdir -p "$REPOSITORY"
          echo "NOBODYWHO_CANDIDATE_MAVEN_REPO=$REPOSITORY" >> "$GITHUB_ENV"

      - name: "Setup JDK"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - name: "Cache Gradle"
        uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-devicetest-${{ hashFiles('nobodywho/testing-apps/kotlin/**/*.gradle*', 'nobodywho/kotlin/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-devicetest-

      - name: "Stage the Kotlin release candidate"
        id: kotlin-candidate
        working-directory: ./nobodywho/kotlin
        run: |
          set -euo pipefail
          VERSION="0.0.0-candidate.${GITHUB_RUN_ID}"
          if [[ "$GITHUB_REF_NAME" == nobodywho-kotlin-v* ]]; then
            VERSION=${GITHUB_REF_NAME#nobodywho-kotlin-v}
          fi

          # These are the same MavenPublication artifacts and generated POMs
          # used by the release. Candidate is a file:// repository under
          # RUNNER_TEMP, so this cannot publish outside the current runner.
          ./gradlew \
            :nobodywho-core:publishReleasePublicationToCandidateRepository \
            :android:publishReleasePublicationToCandidateRepository \
            -Pversion="$VERSION" \
            -PcandidateRepository="$NOBODYWHO_CANDIDATE_MAVEN_REPO"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Supplying a version disables the composite build. The app therefore
      # consumes the staged AAR, JAR, and POMs exactly like a Maven consumer.
      - name: "Assemble app + androidTest APKs from the candidate"
        working-directory: ./nobodywho/testing-apps/kotlin
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest \
            -PnobodywhoVersion=${{ steps.kotlin-candidate.outputs.version }} \
            -PnobodywhoRepository="$NOBODYWHO_CANDIDATE_MAVEN_REPO"

      - name: "Locate APKs"
        id: apks
        run: |
          set -euo pipefail
          B=nobodywho/testing-apps/kotlin/build/outputs/apk
          echo "app=$(find $B/debug -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"
          echo "test=$(find $B/androidTest/debug -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/run-ftl
        with:
          app-apk: ${{ steps.apks.outputs.app }}
          test-apk: ${{ steps.apks.outputs.test }}
          native-lib: libnobodywho_uniffi.so
          devices: ${{ inputs.device || 'both' }}
          test-timeout: ${{ inputs.test_timeout || '30m' }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

  kotlin-released:
    needs: select
    if: needs.select.outputs.kotlin_released == 'true'
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: "Setup JDK"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - name: "Cache Gradle"
        uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-released-${{ hashFiles('nobodywho/testing-apps/kotlin/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-released-

      - name: "Resolve latest released version"
        id: released
        run: |
          set -euo pipefail
          VERSION=$(curl -s --fail \
            "https://repo1.maven.org/maven2/ai/nobodywho/nobodywho-android/maven-metadata.xml" \
            | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          if [ -z "$VERSION" ]; then
            echo "::error::could not determine the latest released nobodywho-android version"
            exit 1
          fi
          echo "Testing against ai.nobodywho:nobodywho-android:$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # -PnobodywhoVersion skips the composite build entirely, so the app
      # resolves the published AAR from Maven Central like any consumer.
      - name: "Assemble app + androidTest APKs against the released artifact"
        working-directory: ./nobodywho/testing-apps/kotlin
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest \
            -PnobodywhoVersion=${{ steps.released.outputs.version }}

      - name: "Locate APKs"
        id: apks
        run: |
          set -euo pipefail
          B=nobodywho/testing-apps/kotlin/build/outputs/apk
          echo "app=$(find $B/debug -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"
          echo "test=$(find $B/androidTest/debug -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/run-ftl
        with:
          app-apk: ${{ steps.apks.outputs.app }}
          test-apk: ${{ steps.apks.outputs.test }}
          native-lib: libnobodywho_uniffi.so
          devices: ${{ inputs.device || 'both' }}
          test-timeout: ${{ inputs.test_timeout || '30m' }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

  # --------------------------------------------------------------- Flutter ---
  flutter-source:
    needs: [select, package-source-native-candidates]
    if: >-
      always() &&
      needs.select.outputs.flutter_source == 'true' &&
      (
        needs.select.outputs.use_native_candidates != 'true' ||
        inputs.candidate_aars_prebuilt ||
        needs.package-source-native-candidates.result == 'success'
      )
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: "Download tested Android candidates"
        if: needs.select.outputs.use_native_candidates == 'true'
        uses: actions/download-artifact@v5
        with:
          name: nobodywho-android-candidate-aars
          path: ./android-candidates

      - name: "Stage Flutter native candidate for Maven resolution"
        if: needs.select.outputs.use_native_candidates == 'true'
        uses: ./.github/actions/stage-android-candidate-repository
        with:
          integration: flutter
          candidates-path: android-candidates
          version-source: nobodywho/flutter/nobodywho/android/build.gradle.kts

      - name: "Setup Flutter SDK"
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.5

      - name: "Setup JDK"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - name: "Stage and validate the Flutter release candidate"
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/nobodywho-flutter-source"
          ARCHIVE="$RUNNER_TEMP/nobodywho-flutter.tar.gz"
          CANDIDATE="$RUNNER_TEMP/nobodywho-flutter-candidate"
          mkdir -p "$SOURCE" "$CANDIDATE"

          # --to-archive is pub's own non-uploading path: it applies the same
          # ignore rules, builds the same tar.gz, and runs the same validation
          # as publish, but writes the upload body to a local file.
          git archive HEAD:nobodywho/flutter/nobodywho | tar -x -C "$SOURCE"
          (
            cd "$SOURCE"
            flutter pub publish --to-archive="$ARCHIVE"
          )

          # Pub consumers receive this archive extracted in their package
          # cache. Use that extracted shape as the app's local dependency.
          tar -xzf "$ARCHIVE" -C "$CANDIDATE"
          test -f "$CANDIDATE/pubspec.yaml"
          echo "NOBODYWHO_FLUTTER_CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"

      # Pub supports local candidates as directories. This points at the
      # extracted distributor archive rather than the repository working tree.
      - name: "Install the Flutter release candidate"
        working-directory: ./nobodywho/testing-apps/flutter
        run: |
          cat > pubspec_overrides.yaml <<EOF
          dependency_overrides:
            nobodywho:
              path: $NOBODYWHO_FLUTTER_CANDIDATE
          EOF
          flutter pub get

      - name: "Build app + androidTest APKs"
        working-directory: ./nobodywho/testing-apps/flutter
        run: |
          flutter build apk --debug
          cd android
          ./gradlew app:assembleAndroidTest \
                    app:assembleDebug -Ptarget=integration_test/device_inference_test.dart

      - uses: ./.github/actions/run-ftl
        with:
          app-apk: nobodywho/testing-apps/flutter/build/app/outputs/apk/debug/app-debug.apk
          test-apk: nobodywho/testing-apps/flutter/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          native-lib: libnobodywho_flutter.so
          devices: ${{ inputs.device || 'both' }}
          test-timeout: ${{ inputs.test_timeout || '30m' }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

  flutter-released:
    needs: select
    if: needs.select.outputs.flutter_released == 'true'
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: "Setup JDK"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - name: "Setup Flutter SDK"
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.5

      # Resolve the newest published version explicitly. Relying on the
      # committed pubspec/lockfile would pin this job to whatever was current
      # when it was written, so it would stop testing what we actually ship.
      - name: "Resolve the published package"
        working-directory: ./nobodywho/testing-apps/flutter
        run: |
          set -euo pipefail
          # Guard against a committed override; this job must use pub.dev.
          rm -f pubspec_overrides.yaml
          VERSION=$(curl -s --fail "https://pub.dev/api/packages/nobodywho" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['latest']['version'])")
          echo "Testing against nobodywho $VERSION"
          flutter pub add "nobodywho:$VERSION"

      - name: "Build app + androidTest APKs"
        working-directory: ./nobodywho/testing-apps/flutter
        run: |
          flutter build apk --debug
          cd android
          ./gradlew app:assembleAndroidTest \
                    app:assembleDebug -Ptarget=integration_test/device_inference_test.dart

      - uses: ./.github/actions/run-ftl
        with:
          app-apk: nobodywho/testing-apps/flutter/build/app/outputs/apk/debug/app-debug.apk
          test-apk: nobodywho/testing-apps/flutter/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          native-lib: libnobodywho_flutter.so
          devices: ${{ inputs.device || 'both' }}
          test-timeout: ${{ inputs.test_timeout || '30m' }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

  # ---------------------------------------------------------- React Native ---
  react-native-source:
    needs: [select, package-source-native-candidates]
    if: >-
      always() &&
      needs.select.outputs.react_native_source == 'true' &&
      (
        needs.select.outputs.use_native_candidates != 'true' ||
        inputs.candidate_aars_prebuilt ||
        needs.package-source-native-candidates.result == 'success'
      )
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: "Download tested Android candidates"
        if: needs.select.outputs.use_native_candidates == 'true'
        uses: actions/download-artifact@v5
        with:
          name: nobodywho-android-candidate-aars
          path: ./android-candidates

      - name: "Stage UniFFI candidate for Maven resolution"
        if: needs.select.outputs.use_native_candidates == 'true'
        uses: ./.github/actions/stage-android-candidate-repository
        with:
          integration: uniffi
          candidates-path: android-candidates
          version-source: nobodywho/react-native/android/build.gradle

      # The React Native template declares engines.node >= 22.11.0.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nobodywho/testing-apps/react-native/package-lock.json

      - name: "Setup JDK"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The RN template pins its own SDK/NDK versions; install exactly those so
      # AGP never tries to auto-install into the SDK.
      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358"

      - name: "Cache Gradle"
        uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-rn-${{ hashFiles('nobodywho/testing-apps/react-native/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-rn-

      # npm publish creates this same tarball before uploading it. Packing it
      # locally exercises the package's files allowlist and lifecycle scripts
      # without contacting the registry's publication endpoint.
      - name: "Pack the React Native release candidate"
        working-directory: ./nobodywho/react-native
        run: |
          set -euo pipefail
          DESTINATION="$RUNNER_TEMP/nobodywho-react-native-candidate"
          mkdir -p "$DESTINATION"
          npm pack --pack-destination "$DESTINATION"
          mapfile -t PACKAGES < <(find "$DESTINATION" -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ ${#PACKAGES[@]} -ne 1 ]]; then
            echo "::error::expected exactly one React Native candidate tarball"
            exit 1
          fi
          echo "NOBODYWHO_REACT_NATIVE_CANDIDATE=${PACKAGES[0]}" >> "$GITHUB_ENV"

      - name: "Install the React Native release candidate"
        working-directory: ./nobodywho/testing-apps/react-native
        run: |
          set -euo pipefail
          npm install "$NOBODYWHO_REACT_NATIVE_CANDIDATE"

      - name: "Build app + androidTest APKs"
        working-directory: ./nobodywho/testing-apps/react-native/android
        run: ./gradlew app:assembleRelease app:assembleReleaseAndroidTest

      - uses: ./.github/actions/run-ftl
        with:
          app-apk: nobodywho/testing-apps/react-native/android/app/build/outputs/apk/release/app-release.apk
          test-apk: nobodywho/testing-apps/react-native/android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          native-lib: libnobodywho_uniffi.so
          devices: ${{ inputs.device || 'both' }}
          test-timeout: ${{ inputs.test_timeout || '30m' }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

  react-native-released:
    needs: select
    if: needs.select.outputs.react_native_released == 'true'
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The React Native template declares engines.node >= 22.11.0.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nobodywho/testing-apps/react-native/package-lock.json

      - name: "Setup JDK"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358"

      - name: "Cache Gradle"
        uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-rn-${{ hashFiles('nobodywho/testing-apps/react-native/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-rn-

      # No local linking and no staged .so: the binding resolves the published
      # npm package and downloads its released native library, exactly as a
      # consumer does.
      # @latest rather than the committed lockfile, which would pin this job to
      # a single release forever and stop it testing what we actually ship.
      - name: "Install the published package"
        working-directory: ./nobodywho/testing-apps/react-native
        run: |
          set -euo pipefail
          npm install react-native-nobodywho@latest
          # `npm ls`, not require('<pkg>/package.json') — the package declares an
          # exports map, so Node refuses any subpath it does not list.
          npm ls react-native-nobodywho --depth=0 || true

      - name: "Build app + androidTest APKs"
        working-directory: ./nobodywho/testing-apps/react-native/android
        run: ./gradlew app:assembleRelease app:assembleReleaseAndroidTest

      - uses: ./.github/actions/run-ftl
        with:
          app-apk: nobodywho/testing-apps/react-native/android/app/build/outputs/apk/release/app-release.apk
          test-apk: nobodywho/testing-apps/react-native/android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          native-lib: libnobodywho_uniffi.so
          devices: ${{ inputs.device || 'both' }}
          test-timeout: ${{ inputs.test_timeout || '30m' }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
