[package]
name = "nobodywho-python"
version = "5.0.0"
edition = "2021"


[lib]
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["kokoro"]
# Kokoro text-to-speech, which links espeak-ng (GPL-3.0-or-later).
# Build with `--no-default-features` to leave it out.
kokoro = ["nobodywho/kokoro"]

[dependencies]
rand = "0.10.2"
nobodywho = { path = "../core", default-features = false }
pyo3-async-runtimes = { version = "0.29", features = [
    "attributes",
    "tokio-runtime",
] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
log = "0.4"
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = "0.3.19"
futures = "0.3.31"
pyo3-log = "0.13.4"
pythonize = "0.29.0"
nom = "8.0.0"


[dependencies.pyo3]
version = "0.29.0"
# "abi3-py39" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.9.
# pyo3 0.29 dropped support for Python 3.8 (EOL), so the abi3-py38 feature no longer exists.
features = ["abi3-py39", "experimental-async", "experimental-inspect"]
