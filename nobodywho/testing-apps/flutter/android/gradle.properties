# Flutter's template asks for -Xmx8G plus 4G of metaspace. This app builds
# comfortably well below that, and the smaller ceiling keeps the daemon within
# reach on machines that cannot spare 12G.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Device tests run on arm64 phones only. Restricting this also keeps the
# plugin's own native-library resolution from requesting an x86_64 .so this
# build never produces — see build.gradle.kts in the nobodywho plugin.
# `flutter build apk` reads this too, so it applies uniformly whether the
# next step is `flutter build apk` or a raw `./gradlew` invocation, unlike
# --target-platform on the CLI, which is scoped to a single process.
target-platform=android-arm64
