name: nobodywho_testapp
description: "Device-test host app for the NobodyWho Flutter binding."
publish_to: 'none'
version: 1.0.0+1

environment:
  # Matches the binding's own constraint so this app builds on the Flutter
  # version CI pins as well as newer local toolchains.
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # The bindings in this repo by default, so a change on a branch gets device
  # coverage before it ships. The released-package CI job writes a
  # pubspec_overrides.yaml pinning the published version instead (see README).
  nobodywho:
    path: ../../flutter/nobodywho

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  logging: ^1.3.0

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
