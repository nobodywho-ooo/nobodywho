[workspace]
members = [
    "core",
    "server",
    "godot",
    "flutter/rust",
    "python",
    "python/make_stubs",
    "grammar/gbnf",
    "grammar/gbnf-macro",
    "uniffi",
]
default-members = [
    "core",
    "server",
    "godot",
    "flutter/rust",
    "python",
    "python/make_stubs",
    "grammar/gbnf",
    "grammar/gbnf-macro",
    "uniffi",
]

# edition = "2021" implies resolver = "2".
resolver = "2"

# Keeps build-dependency units identical across `cargo build` and `cargo check`
# so llama-cpp-sys-2 is only built once.
[profile.dev.build-override]
debug = false
