def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  def supported = ["arm64-v8a", "x86_64"]
  def requested = value ? value.split(",").collect { it.trim() } : supported
  def selected = requested.findAll { supported.contains(it) }
  if (selected.isEmpty()) {
    throw new GradleException("NobodyWho supports these Android ABIs: ${supported.join(', ')}")
  }
  return selected
}

