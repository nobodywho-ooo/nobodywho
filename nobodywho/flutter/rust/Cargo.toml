[package]
name = "nobodywho-flutter"
version = "6.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["kokoro"]
# Kokoro text-to-speech, which links espeak-ng (GPL-3.0-or-later).
# Build with `--no-default-features` to leave it out.
kokoro = ["nobodywho/kokoro"]

[dependencies]
nobodywho = { path = "../../core", default-features = false }
# FIXME: Remove `broken_logging` workaround once v2.14.0 is out.
flutter_rust_bridge = { version = "=2.13.0", features = ["serde_json"] }
regex = "1.11.2"
serde_json = "1.0.145"
futures = "0.3.31"
# Make `tracing` emit events to `log` when no subscriber is installed.
tracing = { version = "0.1.41", features = ["log"] }
log = "0.4.33"
nom = "8.0.0"

[build-dependencies]
flutter_rust_bridge_codegen = "2.13.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand, broken_logging)'] }
