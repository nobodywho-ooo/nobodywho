[package]
name = "nobodywho-godot"
version = "13.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["kokoro"]
# Kokoro text-to-speech, which links espeak-ng (GPL-3.0-or-later).
# Build with `--no-default-features` to leave it out.
kokoro = ["nobodywho/kokoro"]

[dependencies]
nobodywho = { path = "../core", default-features = false }
godot = { version = "0.5.4", features = [ "register-docs", "experimental-threads" ] }
tokio = "1.44.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
serde_json = { version = "1.0.140", features = [ "preserve_order" ] }
