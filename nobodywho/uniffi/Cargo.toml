[package]
name = "nobodywho-uniffi"
version = "0.4.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "nobodywho_uniffi"

[dependencies]
nobodywho = { path = "../core" }
uniffi = { version = "0.30", features = ["cli"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43.0", features = ["sync"] }
# Make `tracing` emit events to `log` when no subscriber is installed.
tracing = { version = "0.1.41", features = ["log"] }
log = "0.4.34"

[target.'cfg(all(target_vendor = "apple", not(target_os = "macos")))'.dependencies]
oslog = "0.2.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[target.'cfg(target_family = "wasm")'.dependencies]
console_log = "1.1.0"

[target.'cfg(not(any(target_os = "android", all(target_vendor = "apple", not(target_os = "macos")), target_family = "wasm")))'.dependencies]
env_logger = "0.11.11"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
