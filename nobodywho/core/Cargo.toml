[package]
name = "nobodywho"
version = "2.4.0"
edition = "2021"

[features]
dynamic-llama = [
    "dep:process_path",
    "dep:llama-cpp-sys-2",
    "llama-cpp-2/dynamic-backends",
    "llama-cpp-2/dynamic-link",
]
# For Android consumers that link llama statically (i.e. without `dynamic-llama`):
# statically link the C++ stdlib so the produced .so is self-contained. Without
# `dynamic-llama` there is no build.rs pass to co-locate `libc++_shared.so`, so a
# dynamic libc++ would leave a DT_NEEDED nothing in the package satisfies.
#
# Never enable this on Linux: there `static-stdcxx` makes llama-cpp-rs's build.rs
# add the compiler's static-archive dir (`emit_compiler_static_archive_search_path`)
# to the link search path, which resolves `-lgomp` to the non-PIC `libgomp.a` and
# breaks linking the cdylib ("relocation R_X86_64_TPOFF32 against hidden symbol
# `gomp_tls_data`").
android-static-stdcxx = ["llama-cpp-2/android-static-stdcxx"]

[dependencies]
misaki-rs = { git = "https://github.com/MicheleYin/misaki-rs", branch = "main", default-features = false }
encoding_rs = "0.8.34"
thiserror = "2.0.3"
miette = { version = "5", features = ["fancy"] }
minijinja = { version = "2.11.0", features = ["builtins", "json", "loader"] }
minijinja-contrib = { version = "2.11.0", features = ["pycompat"] }
monty = { git = "https://github.com/pydantic/monty", tag = "v0.0.7" }
bashkit = { git = "https://github.com/everruns/bashkit", tag = "v0.1.10" }
serde = { version = "1.0.215", features = ["derive"] }
chrono = "0.4.39"
gbnf = { path = "../grammar/gbnf" }
llguidance = "1.7.5"

llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "b48ce80b4f2c6c0f76227be27f8cba8624f4c0dc", default-features = false, features = [
    "openmp",
    "mtmd",
    "llguidance",
    "common",
] }
# Direct dep (alongside the transitive one via llama-cpp-2) so this crate's build.rs
# receives DEP_LLAMA_BACKENDS_DIR — the dir where GGML_BACKEND_DL installs the dlopen'd
# ggml backend modules — and can co-locate them next to our binary (see build.rs).
# Optional: only pulled in by `dynamic-llama`.
# Must stay pinned to the exact same rev as llama-cpp-2 above: both resolve to a
# crate declaring `links = "llama"`, and cargo refuses a graph with two of those.
llama-cpp-sys-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "b48ce80b4f2c6c0f76227be27f8cba8624f4c0dc", default-features = false, optional = true }
lazy_static = "1.5.0"
tokio = { version = "1.43.0", features = [
    "sync",
    "rt",
    "rt-multi-thread",
    "macros",
] }
tokio-stream = "0.1.17"
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = "0.3.19"
regex = "1.11.1"
serde_json = "1.0.140"
nom = "8.0.0"
rand = "0.9.3"
futures = "0.3.31"
ahash = "0.8.12"
indexmap = "2.13.0"
ureq = { version = "3", features = ["rustls"] }
indicatif = "0.18"
walkdir = "2.5"
tempfile = "3"
hound = "3"
safetensors = "0.5"
# SpeechToText audio pipeline: WAV via hound, MP3 via symphonia-bundle-mp3 directly
symphonia-core = "0.5"
symphonia-bundle-mp3 = { version = "0.5", default-features = false, features = ["mp3"] }
rubato = "0.16"
mel_spec = "0.4"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
sentencepiece-rs = "0.2"
# Shared by SpeechToText (via mel_spec) and TextToSpeech (supertonic); use 0.17 as the workspace default
ndarray = "0.17"
rand_distr = "0.5"
unicode-normalization = "0.1"
emojis = "0.9.0"
unicode-segmentation = "1.13.3"

[build-dependencies]
cc = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
process_path = { version = "0.1.4", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# No llama-cpp-2 override here any more: Android's llama config is selected by the
# consuming binding's feature choice (`dynamic-llama` vs `android-static-stdcxx`,
# see the [features] block above), not hardcoded per-target.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-20"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "6"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-20"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

# ort is pinned exactly: `2.0.0-rc.12` would also accept rc.13, which breaks us
# in two ways. (1) rc.13 puts `ort::ep::CUDA` behind the `cuda` feature, which we
# only enable on linux/windows, so every Apple/Android build fails to compile
# `core/src/onnx.rs`. (2) rc.13 made prebuilt-dist feature matching strict, and
# pyke ships no CUDA-capable dist for aarch64-linux — instead of falling back
# like rc.12 did, ort-sys emits a deliberately unresolvable symbol, so aarch64
# Linux cdylibs link fine but fail to load at runtime.
# Unpin once we've migrated (cfg-gate the CUDA import, and either narrow `cuda`
# to x86_64 or enable ort's `lax-feature-matching`).
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["cuda"] }

[dependencies.espeak-ng]
version = "0.1.2"
default-features = false
features = [
    "bundled-data-en",
    "bundled-data-es",
    "bundled-data-fr",
    "bundled-data-it",
    "bundled-data-pt",
]

# Enable Vulkan for x86_64, x86, and aarch64 targets (excluding Apple platforms and Android).
# Apple platforms use Metal, which is auto-enabled by llama-cpp-rs for all Apple targets
# (except watchOS which has no Metal support — handled in llama-cpp-rs build.rs).
[target.'cfg(all(not(target_os = "macos"), not(target_os = "ios"), not(target_os = "visionos"), not(target_os = "watchos"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "x86", target_arch = "aarch64")))'.dependencies]
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "b48ce80b4f2c6c0f76227be27f8cba8624f4c0dc", default-features = false, features = [
    "openmp",
    "vulkan",
    "mtmd",
    "llguidance",
    "common",
] }
