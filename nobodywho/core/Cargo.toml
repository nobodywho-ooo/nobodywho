[package]
name = "nobodywho"
version = "2.4.0"
edition = "2021"

[dependencies]
misaki-rs = { version = "0.6.0", default-features = false }
encoding_rs = "0.8.34"
thiserror = "2.0.3"
miette = { version = "7.6.0", features = ["fancy"] }
minijinja = { version = "2.11.0", features = ["builtins", "json", "loader", "preserve_order"] }
minijinja-contrib = { version = "2.11.0", features = ["pycompat"] }
monty = "0.0.23"
monty-types = "0.0.23"
bashkit = "0.18.1"
serde = { version = "1.0.215", features = ["derive"] }
chrono = "0.4.39"
gbnf = { path = "../grammar/gbnf" }
llguidance = "1.7.5"
# Currently llama.cpp v0.8.0, update the docs too when updating this.
llama-cpp-2 = { git = "https://github.com/nobodywho-ooo/llama-cpp-rs.git", branch = "lfm-support-hack", default-features = false, features = [
    "openmp",
    "mtmd",
    "llguidance",
    "common",
] }
tokio = { version = "1.43.0", features = [
    "sync",
    "rt",
    "macros",
] }
tokio-stream = "0.1.17"
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = "0.3.19"
regex = "1.11.1"
serde_json = { version = "1.0.140", features = ["preserve_order"] }
nom = "8.0.0"
rand = "0.10.2"
futures = "0.3.31"
ahash = "0.8.12"
indexmap = { version = "2.13.0", features = ["serde"] }
ureq = { version = "3", default-features = false }
indicatif = "0.18"
walkdir = "2.5"
tempfile = "3"
hound = "3"
safetensors = "0.8.0"
# SpeechToText audio pipeline: WAV via hound, MP3 via symphonia-bundle-mp3 directly
symphonia-core = "0.5"
symphonia-bundle-mp3 = { version = "0.5", default-features = false, features = [
    "mp3",
] }
rubato = "0.16"
mel_spec = "0.5"
tokenizers = { version = "0.23.2", default-features = false, features = [
    "onig",
] }
sentencepiece-rs = "0.2"
# Shared by SpeechToText (via mel_spec) and TextToSpeech (supertonic); use 0.17 as the workspace default
ndarray = "0.17"
rand_distr = "0.6"
unicode-normalization = "0.1"
emojis = "0.9.0"
unicode-segmentation = "1.13.3"
espeak-ng = { version = "0.2.0", default-features = false, features = [
    "bundled-data-en",
    "bundled-data-es",
    "bundled-data-fr",
    "bundled-data-it",
    "bundled-data-pt",
] }
yoke = "0.8.3"
sync_wrapper = "1.0.2"
# ort is pinned exactly because its release candidates make breaking changes;
# bump deliberately and run /full-ci. Keep the CI-built ONNX Runtime in step
# (`ort_version` in the build-ort action) with ort-sys's prebuilts (dist.tsv).
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-rustls",
    "copy-dylibs",
    "api-20",
] }

[target.'cfg(any(target_os = "android", target_vendor = "apple"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
# Statically link the C++ stdlib (libc++) on Android so the produced shared
# library is self-contained. This is Android-only on purpose: on Linux, the
# `static-stdcxx` feature makes llama-cpp-rs's build.rs add the compiler's
# static-archive dir (`emit_compiler_static_archive_search_path`) to the link
# search path, which then resolves `-lgomp` to the non-PIC `libgomp.a` and
# breaks linking the cdylib ("relocation R_X86_64_TPOFF32 against hidden symbol
# `gomp_tls_data`"). Desktop keeps the dynamic libstdc++ it has always used.
llama-cpp-2 = { git = "https://github.com/nobodywho-ooo/llama-cpp-rs.git", branch = "lfm-support-hack", default-features = false, features = [
    "android-static-stdcxx",
    "vulkan",
    "opencl",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_SystemInformation",
] }

# `cuda` only where pyke ships a CUDA build: with strict feature matching, asking
# for it elsewhere (aarch64 Linux) links fine but fails to load at runtime.
# Keep this cfg in sync with the CUDA cfgs in core/src/onnx.rs.
[target.'cfg(all(any(target_os = "linux", target_os = "windows"), target_arch = "x86_64"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
    "cuda",
] }

# Enable Vulkan for x86_64, x86, and aarch64 targets (excluding Apple platforms and Android).
# Apple platforms use Metal, which is auto-enabled by llama-cpp-rs for all Apple targets
# (except watchOS which has no Metal support — handled in llama-cpp-rs build.rs).
[target.'cfg(all(not(target_os = "macos"), not(target_os = "ios"), not(target_os = "visionos"), not(target_os = "watchos"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "x86", target_arch = "aarch64")))'.dependencies]
llama-cpp-2 = { git = "https://github.com/nobodywho-ooo/llama-cpp-rs.git", branch = "lfm-support-hack", default-features = false, features = [
    "openmp",
    "vulkan",
    "mtmd",
    "llguidance",
    "common",
] }

# `dirs` doesn't support Android and Emscripten, we have our own custom impls there.
[target.'cfg(not(any(target_os = "android", target_os = "emscripten")))'.dependencies]
dirs = "7.0.0"

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
tokio = { version = "1.43.0", features = ["rt-multi-thread"] }
ureq = { version = "3", features = ["rustls"] }

[target.'cfg(target_os = "emscripten")'.dependencies]
# FIXME(madsmtm): Use `ort-web` or compile ONNX for Emscripten (possibly pre-compiled by ort-sys too?)
#
# For now, we just disable it. This will fail at runtime if the user calls any of these APIs.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["alternative-backend"] }

# Unifies host bitflags features (uniffi enables `std`) so llama-cpp-sys-2 is only built once.
[build-dependencies]
bitflags = { version = "2", features = ["std"] }
