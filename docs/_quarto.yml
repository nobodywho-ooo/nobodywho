format:
  html:
    theme: [cosmo, theme.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    toc-expand: 1
    lightbox: true
    code-copy: true
    code-overflow: wrap
    code-annotations: select
    fig-width: 8
    fig-height: 4
    link-external-newwindow: true
    include-in-header:
      - text: |
          <link rel="alternate" type="text/markdown" title="LLM-readable docs index" href="/llms.txt">
          <link rel="alternate" type="text/markdown" title="LLM-readable full docs" href="/llms-full.txt">
          <script defer data-domain="docs.nobodywho.ooo" src="https://plausible.io/js/pa-AqBGVqlDgFry_9WZW3j-D.js"></script>
          <script>window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)};plausible.init=plausible.init||function(i){plausible.o=i||{}};plausible.init();</script>
    include-after-body:
      - copy-page.html
      - version-switcher.html

execute:
  enabled: false
