project:
  type: website
  output-dir: _site
  post-render:
    - scripts/generate_llms.py
  render:
    - index.qmd
    - docs/*.md
    - kotlin/**/*.md
    - python/**/*.md
    - swift/**/*.md
    - react-native/**/*.md
    - flutter/**/*.md
    - godot/**/*.md
  resources:
    - .nojekyll
    - img
    - versions.json
    - version-switcher.js

website:
  title: NobodyWho
  description: Local LLM inference for Kotlin, Python, Swift, React Native, Flutter, and Godot
  site-url: https://docs.nobodywho.ooo
  favicon: img/favicon.ico
  bread-crumbs: true
  page-navigation: true
  search:
    location: navbar
    type: overlay
  navbar:
    logo: img/icon.svg
    logo-alt: NobodyWho
    collapse-below: lg
    left:
      - text: Basics
        menu:
          - text: Welcome
            href: index.qmd
          - text: Overview
            href: docs/index.md
          - text: LLM basics
            href: docs/llm-basics.md
          - text: Model selection
            href: docs/model-selection.md
      - text: Kotlin
        href: kotlin/index.md
      - text: Python
        href: python/index.md
      - text: Swift
        href: swift/index.md
      - text: React Native
        href: react-native/index.md
      - text: Flutter
        href: flutter/index.md
      - text: Godot
        href: godot/install.md
    tools:
      - icon: github
        href: https://github.com/nobodywho-ooo/nobodywho
        aria-label: GitHub repository
      - icon: discord
        href: https://discord.gg/qhaMc2qCYB
        aria-label: Discord server
  sidebar:
    - id: basics
      title: Basics
      style: docked
      contents:
        - text: Welcome
          href: index.qmd
        - docs/index.md
        - docs/llm-basics.md
